    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #07050f; color: #f8fafc; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }

    ::-webkit-scrollbar-thumb { background: #2b1b54; border-radius: 3px; }

    @keyframes studentTakeover {
      0% { opacity: 0; transform: scale(0.96); filter: blur(8px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }

    @keyframes slideInFromTop {
      0% { opacity: 0; transform: translateY(-28px); }

    @keyframes slideInFromBottom {
      0% { opacity: 0; transform: translateY(28px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardPopIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.94); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .student-takeover-bg {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at 50% 0%, #1e0938 0%, #07050f 80%);
      animation: studentTakeover 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .student-banner-anim {
      animation: slideInFromTop 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
    }

    .student-period-anim {
      animation: slideInFromBottom 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }

    .student-floor-anim {
      animation: slideInFromBottom 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
    }

    .student-content-anim {
      animation: slideInFromBottom 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
    }

    .hall-card-anim {
      animation: cardPopIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .hall-card-anim:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.25), 0 0 12px rgba(167, 139, 250, 0.2);
      border-color: rgba(167, 139, 250, 0.6) !important;
      transition: all 0.2s ease;
    }

    function _decryptPayload(b64Str, key) {
      try {
        const binaryStr = atob(b64Str);
        const bytes = new Uint8Array(binaryStr.length);
        const keyBytes = new TextEncoder().encode(key);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
        }
        const jsonStr = new TextDecoder("utf-8").decode(bytes);
        return JSON.parse(jsonStr);
      } catch(e) {
        console.error("Payload decryption error:", e);
        return { CN: {}, HI: {}, SCH: {} };
      }
    }

        let animId;
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const onResize = () => {
          if (!canvas) return;
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', onResize);

        const pts = Array.from({ length: 50 }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 2 + 0.5,
          dx: (Math.random() - 0.5) * 0.5,
          dy: (Math.random() - 0.5) * 0.5,
          a: Math.random() * 0.6 + 0.2
        }));

        const draw = () => {
          ctx.clearRect(0, 0, w, h);
          pts.forEach(p => {
            p.x += p.dx; p.y += p.dy;
            if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(167, 139, 250, ${p.a})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#8b5cf6';
            ctx.fill();
          });
          animId = requestAnimationFrame(draw);
        };
        draw();
        return () => {
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(animId);
        };
      }, []);

      return (
        <div style={{
          position: "fixed", top: 0, left: 0, width: "100vw", height: "100vh",
          overflow: "hidden", zIndex: 0, pointerEvents: "none"
        }}>
          <canvas ref={canvasRef} style={{
            position: "absolute", top: 0, left: 0, width: "100%", height: "100%",

          }} />

    function FreeHallsView({day,effectivePid,curSid,floor,role,onApplySwap}){
      const [expandedBusyHid, setExpandedBusyHid] = useState(null);
      const [resModalHid, setResModalHid] = useState(null);
      const clickTimers = useRef({});

      const handleBusyClick = (e, hid) => {
        const now = Date.now();
        const times = (clickTimers.current[hid] || []).filter(t => now - t < 700);
        times.push(now);
        clickTimers.current[hid] = times;

        if (e.detail >= 3 || times.length >= 3) {
          clickTimers.current[hid] = [];
          if (role === "faculty") {
            setResModalHid(hid);
          }
          return;
        }

        setExpandedBusyHid(expandedBusyHid === hid ? null : hid);
      };
      const slot=ALL_SLOTS.find(s=>s.id===effectivePid);
      const isRest=slot&&(slot.ptype==="break"||slot.ptype==="lunch");
      const outside=!effectivePid;
      const halls=floorHalls(floor).map(hid=>({
        id:hid,...HALL_INFO[hid],
        free:isRest||outside||isHallFree(hid,day,effectivePid),
        hasData:hasTimetable(hid),
      }));
      const fp=halls.filter(h=>h.free&&h.proj);
      const fn=halls.filter(h=>h.free&&!h.proj);
      const busy=halls.filter(h=>!h.free);
      return(
        <div>
          {outside&&<div style={{background:THEME.cardBg,border:`1px solid ${THEME.cardBorder}`,borderRadius:14,padding:22,textAlign:"center",marginBottom:14}}>
            <div style={{fontSize:28,marginBottom:6}}>🌙</div>
            <p style={{color:THEME.mutedText,fontWeight:600,margin:0}}>Outside College Hours</p>
            <p style={{color:THEME.mutedText,fontSize:12,margin:"4px 0 0",opacity:0.8}}>Select a period above to check availability</p>
          </div>}
          {isRest&&<div style={{background:"#170e03",border:"1px solid #78350f",borderRadius:14,padding:14,textAlign:"center",marginBottom:14}}>
            <p style={{color:"#fbbf24",fontWeight:700,margin:0,fontSize:14}}>{slot.ptype==="lunch"?"🍱":"☕"} {slot.label} · All halls are free!</p>
          </div>}
          {[{list:fp,icon:"📽️",label:"Free · With Projector",fg:"#5eead4",bg:"#042f2e",br:"#0d9488"},
            {list:fn,icon:"🪑",label:"Free · No Projector",  fg:"#c4b5fd",bg:"#1e1145",br:"#6d28d9"}].map(({list,icon,label,fg,bg,br})=>(
            <div key={label} style={{marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
                <span>{icon}</span>
                <span style={{color:fg,fontWeight:700,fontSize:12,textTransform:"uppercase",letterSpacing:"0.08em"}}>{label}</span>
                <span style={{...bBadge(bg,fg,br),marginLeft:"auto"}}>{list.length}</span>
              </div>
              {list.length===0
                ?<div style={{background:THEME.cardBg,borderRadius:12,padding:12,textAlign:"center",color:THEME.mutedText,fontSize:13,border:`1px solid ${THEME.cardBorder}`}}>None available</div>
                :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:7}}>
                  {list.map((h, idx)=>(
                    <div key={h.id} className="hall-card-anim" style={{animationDelay:`${idx * 0.04}s`,background:THEME.cardBg,border:`1px solid ${br}50`,borderRadius:12,padding:"11px 13px"}}>
                      <div style={{fontWeight:800,fontSize:14,color:"#f1f5f9",marginBottom:3}}>Hall {h.id}</div>
                      <div style={{display:"flex",alignItems:"center",gap:5}}>
                        <span style={bBadge("#041a0e","#34d399","#065f46")}>✓ FREE</span>
                      </div>
                      {!h.hasData&&<div style={{color:THEME.mutedText,fontSize:9,marginTop:4}}>No schedule</div>}
                    </div>
                  ))}
                </div>
              }
            </div>
          ))}
          {role==="faculty"&&!outside&&!isRest&&busy.length>0&&(
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
                <span style={{color:"#f87171",fontWeight:700,fontSize:12,textTransform:"uppercase",letterSpacing:"0.08em"}}>🔴 Occupied</span>
                <span style={{...bBadge("#1c0808","#f87171","#7f1d1d"),marginLeft:"auto"}}>{busy.length}</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:6}}>
                {busy.map((h, idx)=>{
                  const e=h.hasData?getEntry(h.id,day,effectivePid):null;
                  const courseLabel=e&&e.c?(COURSE_NAMES[e.c]||e.c):null;
                  const isExp=expandedBusyHid===h.id;
                  const facName=e&&e.f?e.f:null;
                  return(
                    <div key={h.id} className="hall-card-anim" 
                      onClick={(ev)=>handleBusyClick(ev, h.id)}
                      style={{
                        animationDelay:`${idx * 0.04}s`,
                        background:isExp?"#190b16":THEME.cardBg,
                        border:`1px solid ${isExp?"#ef4444":THEME.cardBorder}`,
                        borderRadius:12,
                        padding:"11px 13px",
                        cursor:"pointer",
                        transition:"all 0.2s ease",
                        boxShadow:isExp?"0 0 12px rgba(239,68,68,0.25)":"none"
                      }}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                        <div style={{fontWeight:800,fontSize:14,color:isExp?"#fca5a5":THEME.mutedText}}>Hall {h.id}</div>
                        <span style={{marginLeft:"auto",fontSize:12}}>{h.proj?"📽️":"🪑"}</span>
                      </div>
                      
                      {/* Faculty Popover just below the hall number */}
                      {isExp&&(
                        <div style={{
                          background:"#2a0d18",
                          border:"1px solid #7f1d1d",
                          borderRadius:8,
                          padding:"6px 8px",
                          margin:"4px 0 6px",
                          animation:"fadeIn 0.2s ease-out"
                        }}>
                          <div style={{color:"#f87171",fontSize:9,textTransform:"uppercase",fontWeight:800,letterSpacing:"0.05em",marginBottom:2}}>
                            Faculty In-Charge
                          </div>
                          <div style={{color:"#fecaca",fontSize:11,fontWeight:700,lineHeight:1.3}}>
                            👤 {facName||"Not Specified"}
                          </div>
                          {role==="faculty"&&(
                            <button 
                              type="button"
                              onClick={(ev)=>{ev.stopPropagation(); setResModalHid(h.id);}}
                              style={{
                                marginTop:6,
                                width:"100%",
                                background:"linear-gradient(135deg, #7c3aed, #6d28d9)",
                                border:"none",
                                borderRadius:6,
                                color:"#fff",
                                fontSize:10,
                                fontWeight:800,
                                padding:"5px 8px",
                                cursor:"pointer",
                                display:"flex",
                                alignItems:"center",
                                justifyContent:"center",
                                gap:5,
                                boxShadow:"0 2px 8px rgba(124,58,237,0.35)"
                              }}>
                              <span>🔄</span> <span>Swap / Extra Class (Triple-Click)</span>
                            </button>
                          )}
                        </div>
                      )}

                      <div style={{display:"flex",alignItems:"center",gap:6,marginTop:2}}>
                        <span style={bBadge("#1c0808","#f87171","#7f1d1d")}>✗ BUSY</span>
                        <span style={{fontSize:10,color:THEME.mutedText,marginLeft:"auto"}}>{isExp?"▲":"▼"}</span>
                      </div>
                      {courseLabel&&<div style={{color:isExp?"#e2e8f0":THEME.mutedText,fontSize:11,marginTop:5,lineHeight:1.3}}>{courseLabel}</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          {resModalHid&&(
            <ReservationModal 
              targetHid={resModalHid}
              day={day}
              effectivePid={effectivePid}
              onClose={()=>setResModalHid(null)}
              onApplySwap={onApplySwap}
            />
          )}
        </div>
      );
    }

    function App(){
      const [screen,   setScreen]   = useState("landing");
      const [pkInput,  setPkInput]  = useState("");
      const [pkErr,    setPkErr]    = useState(false);
      const [showPK,   setShowPK]   = useState(false);
      const [role,     setRole]     = useState(null);
      const [now,      setNow]      = useState(new Date());
      const [selDay,   setSelDay]   = useState(detectDay);
      const [selFloor, setSelFloor] = useState(null);
      const [selRoom,  setSelRoom]  = useState(null);
      const [curSid,   setCurSid]   = useState(getCurSlotId);
      const [selPid,   setSelPid]   = useState(()=>getCurSlotId()||1);
      const [pidLive,  setPidLive]  = useState(true);
      const [panelAnim,setPanelAnim]= useState(false);
      const [swapVersion, setSwapVersion] = useState(0);
      const [activeSwaps, setActiveSwaps] = useState([]);
      const [toastMsg, setToastMsg] = useState(null);

      useEffect(()=>{
        if(toastMsg){
          const t = setTimeout(()=>setToastMsg(null), 4500);
          return ()=>clearTimeout(t);
        }
      }, [toastMsg]);

      const handleApplySwap = (payload) => {
        const { type, day, effectivePid, targetHid } = payload;
        if (!SCH[targetHid]) SCH[targetHid] = {};
        if (!SCH[targetHid][day]) SCH[targetHid][day] = {};

        if (type === "swap") {
          const { fromHid } = payload;
          if (!SCH[fromHid]) SCH[fromHid] = {};
          if (!SCH[fromHid][day]) SCH[fromHid][day] = {};

          const oldTarget = { ...(SCH[targetHid]?.[day]?.[effectivePid] || { t: "free", n: "" }) };
          const oldFrom = { ...(SCH[fromHid]?.[day]?.[effectivePid] || { t: "free", n: "" }) };

          SCH[targetHid][day][effectivePid] = oldFrom;
          SCH[fromHid][day][effectivePid] = oldTarget;

          const swapRecord = {
            id: Date.now(),
            type: "swap",
            day,
            effectivePid,
            targetHid,
            otherHid: fromHid,
            oldTarget,
            oldOther: oldFrom,
            desc: `Exchanged Hall ${targetHid} ↔ Hall ${fromHid}`
          };

          setActiveSwaps(prev => [swapRecord, ...prev]);
          setToastMsg({ text: `✓ Successfully exchanged Hall ${targetHid} with Hall ${fromHid}!`, type: "success" });
          setSwapVersion(v => v + 1);
        } else if (type === "extra") {
          const { freeShiftHid, faculty, courseCode, courseName } = payload;
          if (!SCH[freeShiftHid]) SCH[freeShiftHid] = {};
          if (!SCH[freeShiftHid][day]) SCH[freeShiftHid][day] = {};

          const oldTarget = { ...(SCH[targetHid]?.[day]?.[effectivePid] || { t: "free", n: "" }) };
          const oldFree = { ...(SCH[freeShiftHid]?.[day]?.[effectivePid] || { t: "free", n: "" }) };

          SCH[freeShiftHid][day][effectivePid] = {
            ...oldTarget,
            n: `Shifted from Hall ${targetHid}`
          };

          SCH[targetHid][day][effectivePid] = {
            t: "class",
            c: courseCode,
            f: faculty,
            n: "Extra Class"
          };

          if (courseName && !COURSE_NAMES[courseCode]) {
            COURSE_NAMES[courseCode] = courseName;
          }

          const swapRecord = {
            id: Date.now(),
            type: "extra",
            day,
            effectivePid,
            targetHid,
            otherHid: freeShiftHid,
            oldTarget,
            oldOther: oldFree,
            desc: `Extra Class in Hall ${targetHid} (${courseCode}). Regular class shifted to Hall ${freeShiftHid}.`
          };

          setActiveSwaps(prev => [swapRecord, ...prev]);
          setToastMsg({ text: `✓ Extra Class booked in Hall ${targetHid}! Regular class shifted to Hall ${freeShiftHid}.`, type: "success" });
          setSwapVersion(v => v + 1);
        }
      };

      const handleRevertAll = () => {
        for (const rec of activeSwaps) {
          if (SCH[rec.targetHid]?.[rec.day]) {
            SCH[rec.targetHid][rec.day][rec.effectivePid] = rec.oldTarget;
          }
          if (SCH[rec.otherHid]?.[rec.day]) {
            SCH[rec.otherHid][rec.day][rec.effectivePid] = rec.oldOther;
          }
        }
        setActiveSwaps([]);
        setToastMsg({ text: "↺ All temporary swaps have been reverted.", type: "info" });
        setSwapVersion(v => v + 1);
      };

      const renderToast = () => toastMsg && (
        <div style={{
          position:"fixed",
          bottom:24,
          left:"50%",
          transform:"translateX(-50%)",
          background:toastMsg.type==="error"?"#7f1d1d":"#190d38",
          color:"#fff",
          border:`1.5px solid ${toastMsg.type==="error"?"#ef4444":"#8b5cf6"}`,
          borderRadius:14,
          padding:"12px 22px",
          boxShadow:"0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(139,92,246,0.35)",
          zIndex:10000,
          display:"flex",
          alignItems:"center",
          gap:10,
          fontSize:13,
          fontWeight:600,
          animation:"slideInFromBottom 0.25s ease-out"
        }}>
          <span>{toastMsg.type==="error"?"⚠️":"✨"}</span>
          <span>{toastMsg.text}</span>
          <button onClick={()=>setToastMsg(null)} style={{background:"none",border:"none",color:"#c4b5fd",cursor:"pointer",marginLeft:10,fontSize:14}}>✕</button>
        </div>
      );

      useEffect(()=>{
        const t=setInterval(()=>{
          const sid=getCurSlotId();setNow(new Date());setCurSid(sid);
          if(pidLive&&sid)setSelPid(sid);
        },1000);
        return()=>clearInterval(t);
      },[pidLive]);

      useEffect(()=>{
        setPanelAnim(false);
        if(selRoom){const t=setTimeout(()=>setPanelAnim(true),40);return()=>clearTimeout(t);}
      },[selRoom]);

      const tStr=now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true});
      const dStr=now.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
      const effPid=pidLive?curSid:selPid;

      function logout(){setScreen("landing");setSelFloor(null);setSelRoom(null);setPkInput("");}
      function goLogin(r){setRole(r);setPkInput("");setPkErr(false);setShowPK(false);setScreen("login");}
      async function tryLogin(){
        const isValid = await verifyPasskey(pkInput, role);
        if(isValid){setScreen(role);setSelFloor(null);setSelRoom(null);setPkErr(false);}

                  <div style={{width:1,background:"rgba(255,255,255,0.15)",margin:"2px 0"}}></div>
                  <div>
                    <div style={{color:"rgba(255,255,255,0.55)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em"}}>Active Period</div>
                    <div style={{fontSize:14,fontWeight:700,color:"#e9d5ff",marginTop:4}}>{curSlotObj?.label||"—"}</div>
                  </div>
                  <div style={{width:1,background:"rgba(255,255,255,0.15)",margin:"2px 0"}}></div>
                  <div>
                    <div style={{color:"rgba(255,255,255,0.55)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em"}}>Time Window</div>
                    <div style={{fontSize:12,fontWeight:600,color:"#c4b5fd",marginTop:5}}>{curSlotObj?.time||"Outside hrs"}</div>
                  </div>
                </div>
              </div>
            </div>

            <div className="student-period-anim" style={{position:"relative",zIndex:1,maxWidth:720,margin:"0 auto",padding:"0 20px 8px",width:"100%",boxSizing:"border-box"}}>
              <DayBar selDay={selDay} setSelDay={setSelDay}/>
            </div>

            <div style={{flex:1,padding:"0 20px 20px",maxWidth:720,width:"100%",margin:"0 auto",boxSizing:"border-box",position:"relative",zIndex:1}}>
              <div className="student-period-anim">
                <PeriodSelector selPid={selPid} setSelPid={setSelPid} isLive={pidLive} setIsLive={setPidLive} curSid={curSid}/>
              </div>
              <div className="student-floor-anim">
                <FloorPicker selFloor={selFloor} setSelFloor={setSelFloor} color={THEME.accent}/>
              </div>
              <div className="student-content-anim">
                {!selFloor&&(
                  <div style={{textAlign:"center",padding:"48px 20px",color:THEME.mutedText,background:"rgba(15,11,36,0.45)",borderRadius:20,border:`1px solid ${THEME.cardBorder}`,backdropFilter:"blur(12px)",marginTop:10}}>
                    <div style={{fontSize:42,marginBottom:12,filter:"drop-shadow(0 0 12px rgba(139,92,246,0.5))"}}>🏢</div>
                    <p style={{fontSize:16,fontWeight:700,margin:0,color:THEME.highlight}}>Select a floor above to view free halls</p>
                    <p style={{fontSize:12,color:THEME.mutedText,marginTop:6}}>Find vacant classrooms & projector halls instantly</p>
                  </div>
                )}
                {selFloor&&<FreeHallsView key={`${selFloor}-${effPid}-${swapVersion}`} day={selDay} effectivePid={effPid} curSid={curSid} floor={selFloor} role="student"/>}
              </div>
            </div>
            {renderToast()}
          </div>
        );
      }

      return null;
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
