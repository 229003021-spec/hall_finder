    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #07050f; color: #f8fafc; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }

    ::-webkit-scrollbar-thumb { background: #2b1b54; border-radius: 3px; }

    @keyframes studentTakeover {

      100% { opacity: 1; transform: scale(1); filter: blur(0); }

    @keyframes slideInFromTop {
      0% { opacity: 0; transform: translateY(-28px); }

    }

    @keyframes slideInFromBottom {
      0% { opacity: 0; transform: translateY(28px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardPopIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.94); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .student-takeover-bg {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at 50% 0%, #1e0938 0%, #07050f 80%);
      animation: studentTakeover 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .student-banner-anim {
      animation: slideInFromTop 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
    }

    .student-period-anim {

    }

    .student-floor-anim {
      animation: slideInFromBottom 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
    }

    .student-content-anim {
      animation: slideInFromBottom 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
    }

    .hall-card-anim {
      animation: cardPopIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .hall-card-anim:hover {
      transform: translateY(-3px) scale(1.02);

      border-color: rgba(167, 139, 250, 0.6) !important;
      transition: all 0.2s ease;
    }

    function _decryptPayload(b64Str, key) {
      try {
        const binaryStr = atob(b64Str);
        const bytes = new Uint8Array(binaryStr.length);
        const keyBytes = new TextEncoder().encode(key);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
        }
        const jsonStr = new TextDecoder("utf-8").decode(bytes);
        return JSON.parse(jsonStr);
      } catch(e) {
        console.error("Payload decryption error:", e);
        return { CN: {}, HI: {}, SCH: {} };
      }
    }

    const _DATA_UNPACKED = _decryptPayload(_SECURE_PAYLOAD, _SECURE_KEY);
    const COURSE_NAMES = _DATA_UNPACKED.CN;

    const getCurSlotId=()=>{const m=new Date().getHours()*60+new Date().getMinutes();for(const s of ALL_SLOTS)if(m>=toMins(s.start)&&m<toMins(s.end))return s.id;return null;};

    function VideoBg() {
      const canvasRef = React.useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const onResize = () => {
          if (!canvas) return;
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', onResize);

        const pts = Array.from({ length: 50 }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 2 + 0.5,
          dx: (Math.random() - 0.5) * 0.5,
          dy: (Math.random() - 0.5) * 0.5,
          a: Math.random() * 0.6 + 0.2
        }));

        const draw = () => {
          ctx.clearRect(0, 0, w, h);
          pts.forEach(p => {
            p.x += p.dx; p.y += p.dy;
            if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(167, 139, 250, ${p.a})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#8b5cf6';
            ctx.fill();
          });
          animId = requestAnimationFrame(draw);
        };
        draw();
        return () => {
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(animId);
        };
      }, []);

      return (
        <div style={{
          position: "fixed", top: 0, left: 0, width: "100vw", height: "100vh",
          overflow: "hidden", zIndex: 0, pointerEvents: "none"
        }}>
          <canvas ref={canvasRef} style={{
            position: "absolute", top: 0, left: 0, width: "100%", height: "100%",
            zIndex: 1, background: "transparent"
          }} />
          <video autoPlay loop muted playsInline style={{
            position: "absolute", top: 0, left: 0, width: "100%", height: "100%",
            objectFit: "cover", zIndex: 0, filter: "brightness(0.35) contrast(1.15) saturate(1.3)"
          }}>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4" type="video/mp4" />
            <source src="https://cdn.coverr.co/videos/coverr-digital-lines-and-dots-5412/1080p.mp4" type="video/mp4" />
          </video>
          <div style={{
            position: "absolute", inset: 0, zIndex: 2,
            background: "radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.18) 0%, rgba(7, 5, 15, 0.85) 75%)",
            backdropFilter: "blur(2px)"
          }}></div>
        </div>
      );
    }

    function FreeHallsView({day,effectivePid,curSid,floor,role}){
      const slot=ALL_SLOTS.find(s=>s.id===effectivePid);
      const isRest=slot&&(slot.ptype==="break"||slot.ptype==="lunch");
      const outside=!effectivePid;
      const halls=floorHalls(floor).map(hid=>({
        id:hid,...HALL_INFO[hid],
        free:isRest||outside||isHallFree(hid,day,effectivePid),
        hasData:hasTimetable(hid),
      }));
      const fp=halls.filter(h=>h.free&&h.proj);
      const fn=halls.filter(h=>h.free&&!h.proj);
      const busy=halls.filter(h=>!h.free);
      return(
        <div>
          {outside&&<div style={{background:THEME.cardBg,border:`1px solid ${THEME.cardBorder}`,borderRadius:14,padding:22,textAlign:"center",marginBottom:14}}>

            <p style={{color:THEME.mutedText,fontSize:12,margin:"4px 0 0",opacity:0.8}}>Select a period above to check availability</p>
          </div>}
          {isRest&&<div style={{background:"#170e03",border:"1px solid #78350f",borderRadius:14,padding:14,textAlign:"center",marginBottom:14}}>
            <p style={{color:"#fbbf24",fontWeight:700,margin:0,fontSize:14}}>{slot.ptype==="lunch"?"🍱":"☕"} {slot.label} · All halls are free!</p>
          </div>}
          {[{list:fp,icon:"📽️",label:"Free · With Projector",fg:"#5eead4",bg:"#042f2e",br:"#0d9488"},

            <div key={label} style={{marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
                <span>{icon}</span>
                <span style={{color:fg,fontWeight:700,fontSize:12,textTransform:"uppercase",letterSpacing:"0.08em"}}>{label}</span>
                <span style={{...bBadge(bg,fg,br),marginLeft:"auto"}}>{list.length}</span>
              </div>
              {list.length===0
                ?<div style={{background:THEME.cardBg,borderRadius:12,padding:12,textAlign:"center",color:THEME.mutedText,fontSize:13,border:`1px solid ${THEME.cardBorder}`}}>None available</div>
                :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:7}}>
                  {list.map((h, idx)=>(
                    <div key={h.id} className="hall-card-anim" style={{animationDelay:`${idx * 0.04}s`,background:THEME.cardBg,border:`1px solid ${br}50`,borderRadius:12,padding:"11px 13px"}}>
                      <div style={{fontWeight:800,fontSize:14,color:"#f1f5f9",marginBottom:3}}>Hall {h.id}</div>
                      <div style={{display:"flex",alignItems:"center",gap:5}}>
                        <span style={bBadge("#041a0e","#34d399","#065f46")}>✓ FREE</span>
                      </div>
                      {!h.hasData&&<div style={{color:THEME.mutedText,fontSize:9,marginTop:4}}>No schedule</div>}
                    </div>
                  ))}
                </div>
              }
            </div>
          ))}
          {role==="faculty"&&!outside&&!isRest&&busy.length>0&&(
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
                <span style={{color:"#f87171",fontWeight:700,fontSize:12,textTransform:"uppercase",letterSpacing:"0.08em"}}>🔴 Occupied</span>
                <span style={{...bBadge("#1c0808","#f87171","#7f1d1d"),marginLeft:"auto"}}>{busy.length}</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:6}}>
                {busy.map((h, idx)=>{
                  const e=h.hasData?getEntry(h.id,day,effectivePid):null;
                  const courseLabel=e&&e.c?(COURSE_NAMES[e.c]||e.c):null;
                  return(
                    <div key={h.id} className="hall-card-anim" style={{animationDelay:`${idx * 0.04}s`,background:THEME.cardBg,border:`1px solid ${THEME.cardBorder}`,borderRadius:12,padding:"11px 13px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                        <div style={{fontWeight:700,fontSize:14,color:THEME.mutedText}}>Hall {h.id}</div>
                        <span style={{marginLeft:"auto",fontSize:12}}>{h.proj?"📽️":"🪑"}</span>
                      </div>
                      <span style={bBadge("#1c0808","#f87171","#7f1d1d")}>✗ BUSY</span>

        </div>
      );

                  placeholder="Enter passkey..."
                  style={{width:"100%",padding:"12px 44px 12px 14px",borderRadius:10,
                    border:`1.5px solid ${pkErr?"#ef4444":"rgba(139,92,246,0.4)"}`,
                    background:"rgba(9,6,21,0.8)",color:"#f1f5f9",fontSize:15,outline:"none",
                    boxSizing:"border-box",fontFamily:"inherit"}}/>
                <button onClick={()=>setShowPK(v=>!v)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16}}>
                  {showPK?"🙈":"👁️"}
                </button>
              </div>
              {pkErr&&<p style={{color:"#ef4444",fontSize:13,textAlign:"center",margin:"0 0 14px"}}>❌ Incorrect passkey. Try again.</p>}
              <button onClick={tryLogin} style={{...bBtn(col),width:"100%",padding:13,fontSize:15,borderRadius:10,boxShadow:`0 0 20px ${col}50`}}>Login →</button>
            </div>
          </div>
        );
      }

      if(screen==="dean") return(
        <div className="student-takeover-bg">
          <div style={{position:"fixed",top:-100,left:"50%",transform:"translateX(-50%)",width:700,height:350,background:"radial-gradient(ellipse at center, rgba(139,92,246,0.35) 0%, rgba(0,0,0,0) 70%)",pointerEvents:"none",zIndex:0}}></div>

          <div className="student-banner-anim" style={{background:THEME.headerBg,borderBottom:`1px solid ${THEME.headerBorder}`,padding:"12px 20px",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between",position:"relative",zIndex:1,boxShadow:"0 10px 30px rgba(0,0,0,0.5)"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{fontSize:24}}>👑</div>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{fontSize:18,fontWeight:900,color:"#f1f5f9",letterSpacing:1}}>DEAN PORTAL</div>
                  <span style={{background:"rgba(139,92,246,0.3)",border:"1px solid rgba(167,139,250,0.4)",color:"#c4b5fd",fontSize:10,fontWeight:800,padding:"2px 8px",borderRadius:20,letterSpacing:"0.06em",textTransform:"uppercase"}}>FULL OVERVIEW</span>
                </div>
                <div style={{fontSize:11,color:THEME.mutedText,marginTop:2}}>SASTRA DEEMED UNIVERSITY · SRC KUMBAKONAM</div>
              </div>
            </div>
            
            <div style={{textAlign:"center"}}>
              <div style={{fontFamily:"monospace",fontSize:16,fontWeight:700,color:"#e9d5ff"}}>{tStr}</div>
              <div style={{fontSize:11,color:THEME.highlight,fontWeight:700}}>{DAY_F[selDay]}</div>
            </div>

            <button onClick={logout} 
              style={{...bBtn("rgba(255,255,255,0.08)",THEME.mutedText),padding:"7px 16px",borderRadius:20,border:`1px solid ${THEME.cardBorder}`,backdropFilter:"blur(8px)",transition:"all 0.2s ease"}}
              onMouseOver={e=>e.currentTarget.style.background="rgba(255,255,255,0.18)"}
              onMouseOut={e=>e.currentTarget.style.background="rgba(255,255,255,0.08)"}>
              Logout 🔒
            </button>
          </div>

          <div className="student-period-anim" style={{position:"relative",zIndex:1}}>
            <DayBar selDay={selDay} setSelDay={setSelDay}/>
          </div>
          <div className="student-floor-anim" style={{position:"relative",zIndex:1}}>
            <FloorBar selFloor={selFloor} setSelFloor={setSelFloor} onFloorChange={()=>setSelRoom(null)}/>
          </div>

          <div className="student-content-anim" style={{flex:1,display:"flex",overflow:"hidden",position:"relative",zIndex:1}}>
            <div style={{
              width:selRoom?"20%":180,
              minWidth:selRoom?72:180,
              maxWidth:selRoom?140:180,
              flexShrink:0,borderRight:`1px solid ${THEME.sidebarBorder}`,overflowY:"auto",
              padding:selRoom?"12px 6px":"12px 10px",background:THEME.sidebarBg,
              transition:"width 0.24s ease, min-width 0.24s ease, max-width 0.24s ease, padding 0.24s ease"
            }}>
              {!selFloor&&<p style={{color:THEME.mutedText,fontSize:12,textAlign:"center",marginTop:24,lineHeight:1.5}}>Pick a floor<br/>above</p>}
              {selFloor&&!selRoom&&(
                <React.Fragment>
                  <p style={{color:THEME.mutedText,fontSize:10,textTransform:"uppercase",letterSpacing:"0.1em",margin:"0 0 8px 4px"}}>
                    {ordinal(selFloor)} Floor · {floorHalls(selFloor).length} rooms
                  </p>
                  <div style={{display:"flex",flexDirection:"column",gap:5}}>
                    {floorHalls(selFloor).map((hid, idx)=>{
                      const h=HALL_INFO[hid];
                      const isSel=selRoom===hid;
                      const curE=typeof curSid==="number"&&hasTimetable(hid)?getEntry(hid,selDay,curSid):null;
                      const curF=curE&&curE.t==="class"?curE.f:null;
                      const occ=curE&&curE.t==="class";
                      return(
                        <button key={hid} className="hall-card-anim" style={{animationDelay:`${idx * 0.03}s`,width:"100%",textAlign:"left",padding:"9px 10px",borderRadius:10,
                          border:`1px solid ${isSel?THEME.selectedRoomBorder:THEME.sidebarBorder}`,
                          background:isSel?THEME.selectedRoomBg:"transparent",cursor:"pointer",transition:"all 0.15s ease"}}
                          onClick={()=>setSelRoom(isSel?null:hid)}>
                          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
                            <div style={{width:7,height:7,borderRadius:"50%",flexShrink:0,
                              background:hasTimetable(hid)?(occ?"#ef4444":"#22c55e"):THEME.mutedText,
                              boxShadow:hasTimetable(hid)?`0 0 4px ${occ?"#ef4444":"#22c55e"}`:"none"}}></div>
                            <span style={{color:"#e2e8f0",fontWeight:800,fontSize:13}}>Hall {hid}</span>
                            <span style={{marginLeft:"auto",fontSize:10,flexShrink:0}}>{h.proj?"📽️":"🪑"}</span>
                          </div>
                          <div style={{paddingLeft:14,overflow:"hidden"}}>
                            {hasTimetable(hid)
                              ?<div style={{color:curF?isSel?THEME.highlightSoft:"#a78bfa":"#22c55e",fontSize:10,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                                {curF?"👤 "+curF:"✓ Free now"}
                              </div>
                              :<div style={{color:THEME.mutedText,fontSize:10}}>No schedule</div>
                            }
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </React.Fragment>
              )}
              {selFloor&&selRoom&&(
                <React.Fragment>
                  <button onClick={()=>setSelRoom(null)} style={{width:"100%",textAlign:"center",padding:"6px 4px",marginBottom:8,borderRadius:8,border:`1px solid ${THEME.cardBorder}`,background:"transparent",color:THEME.mutedText,cursor:"pointer",fontSize:14}}>←</button>
                  <div style={{display:"flex",flexDirection:"column",gap:5}}>
                    {floorHalls(selFloor).map(hid=>{
                      const h=HALL_INFO[hid];
                      const isSel=selRoom===hid;
                      const curE=typeof curSid==="number"&&hasTimetable(hid)?getEntry(hid,selDay,curSid):null;
                      const occ=curE&&curE.t==="class";
                      return(
                        <button key={hid} onClick={()=>setSelRoom(hid)} title={`Hall ${hid}`}
                          style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,
                            padding:"8px 2px",borderRadius:10,
                            border:`1px solid ${isSel?THEME.selectedRoomBorder:THEME.sidebarBorder}`,
                            background:isSel?THEME.selectedRoomBg:"transparent",cursor:"pointer"}}>
                          <div style={{width:6,height:6,borderRadius:"50%",flexShrink:0,
                            background:hasTimetable(hid)?(occ?"#ef4444":"#22c55e"):THEME.mutedText,
                            boxShadow:hasTimetable(hid)?`0 0 4px ${occ?"#ef4444":"#22c55e"}`:"none"}}></div>
                          <span style={{color:"#e2e8f0",fontWeight:800,fontSize:12}}>{hid}</span>
                          <span style={{fontSize:12}}>{h.proj?"📽️":"🪑"}</span>
                        </button>
                      );
                    })}
                  </div>
                </React.Fragment>
              )}
            </div>

            <div style={{flex:1,overflowY:"auto",padding:selRoom?"20px 16px":"20px 28px",background:THEME.bgBody}}>
              {!selRoom?(
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:10,userSelect:"none"}}>
                  <div style={{fontSize:52,opacity:.15,filter:"drop-shadow(0 0 10px rgba(139,92,246,0.5))"}}>📋</div>
                  <p style={{color:THEME.mutedText,fontSize:16,fontWeight:600,margin:0}}>Select a hall from the left panel</p>
                  <p style={{color:THEME.mutedText,fontSize:13,margin:0,opacity:0.7}}>The schedule will appear here</p>
                </div>
              ):(
                <div style={{opacity:panelAnim?1:0,transform:panelAnim?"translateX(0)":"translateX(24px)",transition:"opacity 0.28s ease, transform 0.28s ease"}}>
                  <SchedulePanel hallId={selRoom} day={selDay} curSlotId={curSid}/>
                </div>
              )}
            </div>
          </div>
        </div>
      );

      if(screen==="faculty") return(
        <div className="student-takeover-bg">
          <div style={{position:"fixed",top:-100,left:"50%",transform:"translateX(-50%)",width:700,height:350,background:"radial-gradient(ellipse at center, rgba(99,102,241,0.3) 0%, rgba(0,0,0,0) 70%)",pointerEvents:"none",zIndex:0}}></div>

          <div className="student-banner-anim" style={{background:THEME.headerBg,borderBottom:`1px solid ${THEME.headerBorder}`,padding:"14px 20px",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between",position:"relative",zIndex:1,boxShadow:"0 10px 30px rgba(0,0,0,0.5)"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{fontSize:24}}>🎓</div>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{fontSize:18,fontWeight:900,color:"#f1f5f9",letterSpacing:1}}>FACULTY PORTAL</div>
                  <span style={{background:"rgba(99,102,241,0.3)",border:"1px solid rgba(129,140,248,0.4)",color:"#c7d2fe",fontSize:10,fontWeight:800,padding:"2px 8px",borderRadius:20,letterSpacing:"0.06em",textTransform:"uppercase"}}>AVAILABILITY CHECK</span>
                </div>
                <div style={{fontSize:11,color:THEME.mutedText,marginTop:2}}>SASTRA DEEMED UNIVERSITY · SRC KUMBAKONAM</div>
              </div>
            </div>

            <div style={{textAlign:"center"}}>
              <div style={{fontFamily:"monospace",fontSize:16,fontWeight:700,color:"#c7d2fe"}}>{tStr}</div>
              <div style={{fontSize:11,color:THEME.highlight,fontWeight:700}}>{DAY_F[selDay]}</div>
            </div>

            <button onClick={logout} 
              style={{...bBtn("rgba(255,255,255,0.08)",THEME.mutedText),padding:"7px 16px",borderRadius:20,border:`1px solid ${THEME.cardBorder}`,backdropFilter:"blur(8px)",transition:"all 0.2s ease"}}
              onMouseOver={e=>e.currentTarget.style.background="rgba(255,255,255,0.18)"}
              onMouseOut={e=>e.currentTarget.style.background="rgba(255,255,255,0.08)"}>
              Logout 🔒
            </button>
          </div>

          <div className="student-period-anim" style={{position:"relative",zIndex:1}}>
            <DayBar selDay={selDay} setSelDay={setSelDay}/>
          </div>

          <div className="student-content-anim" style={{flex:1,overflowY:"auto",padding:20,maxWidth:820,width:"100%",margin:"0 auto",boxSizing:"border-box",position:"relative",zIndex:1}}>
            <h3 style={{color:THEME.highlight,fontSize:11,textTransform:"uppercase",letterSpacing:"0.09em",margin:"0 0 12px",display:"flex",alignItems:"center",gap:6}}>
              <span>🏛️</span> <span>Hall Availability Overview</span>
            </h3>
            <div className="student-period-anim">
              <PeriodSelector selPid={selPid} setSelPid={setSelPid} isLive={pidLive} setIsLive={setPidLive} curSid={curSid}/>
            </div>
            <div className="student-floor-anim">
              <FloorPicker selFloor={selFloor} setSelFloor={setSelFloor} color={THEME.accent}/>
            </div>
            {!selFloor&&(
              <div style={{textAlign:"center",padding:"42px 20px",color:THEME.mutedText,background:"rgba(15,11,36,0.45)",borderRadius:20,border:`1px solid ${THEME.cardBorder}`,backdropFilter:"blur(12px)",marginTop:14}}>
                <div style={{fontSize:40,marginBottom:10,filter:"drop-shadow(0 0 10px rgba(99,102,241,0.5))"}}>🏢</div>
                <p style={{fontSize:15,fontWeight:700,margin:0,color:THEME.highlight}}>Select a floor above to check vacant & occupied halls</p>
              </div>
            )}
            {selFloor&&<FreeHallsView key={`${selFloor}-${effPid}`} day={selDay} effectivePid={effPid} curSid={curSid} floor={selFloor} role="faculty"/>}
          </div>
        </div>
      );

      if(screen==="student"){
        const freeCount=selFloor?floorHalls(selFloor).filter(hid=>isHallFree(hid,selDay,effPid)||typeof effPid!=="number").length:0;
        const curSlotObj=ALL_SLOTS.find(s=>s.id===effPid);
        return(
          <div className="student-takeover-bg">
            <div style={{position:"fixed",top:-100,left:"50%",transform:"translateX(-50%)",width:700,height:350,background:"radial-gradient(ellipse at center, rgba(139,92,246,0.3) 0%, rgba(0,0,0,0) 70%)",pointerEvents:"none",zIndex:0}}></div>
            
            <div className="student-banner-anim" style={{background:THEME.studentBanner,padding:"20px 20px 24px",flexShrink:0,position:"relative",zIndex:1,boxShadow:"0 10px 30px rgba(0,0,0,0.6)",borderBottom:"1px solid rgba(139,92,246,0.35)"}}>
              <div style={{maxWidth:720,margin:"0 auto"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                      <span style={{fontSize:26}}>🏫</span>
                      <span style={{fontSize:24,fontWeight:900,letterSpacing:-0.5,background:"linear-gradient(135deg, #ffffff 0%, #e9d5ff 100%)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Hall Finder</span>
                      <span style={{background:"rgba(139,92,246,0.35)",border:"1px solid rgba(167,139,250,0.5)",color:"#e9d5ff",fontSize:10,fontWeight:800,padding:"3px 10px",borderRadius:20,letterSpacing:"0.06em",textTransform:"uppercase",boxShadow:"0 0 12px rgba(139,92,246,0.4)"}}>STUDENT PORTAL</span>
                    </div>
                    <div style={{color:"rgba(255,255,255,0.7)",fontSize:12,marginTop:5,fontWeight:600}}>SASTRA DEEMED UNIVERSITY · SRC KUMBAKONAM · {DAY_F[selDay]}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontFamily:"monospace",fontSize:16,fontWeight:700,color:"#e9d5ff"}}>{tStr}</div>
                    <button onClick={()=>{setScreen("landing");setSelFloor(null);}} 
                      style={{...bBtn("rgba(0,0,0,0.4)","rgba(255,255,255,0.9)"),padding:"6px 14px",borderRadius:20,marginTop:6,fontSize:12,border:"1px solid rgba(255,255,255,0.25)",backdropFilter:"blur(8px)",display:"inline-flex",alignItems:"center",gap:5,transition:"all 0.2s ease"}}
                      onMouseOver={e=>e.currentTarget.style.background="rgba(255,255,255,0.2)"}
                      onMouseOut={e=>e.currentTarget.style.background="rgba(0,0,0,0.4)"}>
                      <span>←</span> <span>Home</span>
                    </button>
                  </div>
                </div>

                <div style={{background:"rgba(15,11,36,0.65)",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",borderRadius:16,padding:"14px 20px",marginTop:16,display:"flex",gap:28,flexWrap:"wrap",border:"1px solid rgba(139,92,246,0.3)",boxShadow:"0 8px 24px rgba(0,0,0,0.4)"}}>
                  <div>
                    <div style={{color:"rgba(255,255,255,0.55)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em"}}>Free Halls Now</div>
                    <div style={{fontSize:24,fontWeight:900,color:selFloor?"#4ade80":"#e2e8f0"}}>{selFloor?freeCount:"—"}</div>
                  </div>
                  <div style={{width:1,background:"rgba(255,255,255,0.15)",margin:"2px 0"}}></div>
                  <div>
                    <div style={{color:"rgba(255,255,255,0.55)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em"}}>Active Period</div>
                    <div style={{fontSize:14,fontWeight:700,color:"#e9d5ff",marginTop:4}}>{curSlotObj?.label||"—"}</div>
                  </div>
                  <div style={{width:1,background:"rgba(255,255,255,0.15)",margin:"2px 0"}}></div>
                  <div>
                    <div style={{color:"rgba(255,255,255,0.55)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em"}}>Time Window</div>
                    <div style={{fontSize:12,fontWeight:600,color:"#c4b5fd",marginTop:5}}>{curSlotObj?.time||"Outside hrs"}</div>
                  </div>
                </div>
              </div>
            </div>

            <div style={{flex:1,padding:20,maxWidth:720,width:"100%",margin:"0 auto",boxSizing:"border-box",position:"relative",zIndex:1}}>
              <div className="student-period-anim">
                <PeriodSelector selPid={selPid} setSelPid={setSelPid} isLive={pidLive} setIsLive={setPidLive} curSid={curSid}/>
              </div>
              <div className="student-floor-anim">
                <FloorPicker selFloor={selFloor} setSelFloor={setSelFloor} color={THEME.accent}/>
              </div>
              <div className="student-content-anim">
                {!selFloor&&(
                  <div style={{textAlign:"center",padding:"48px 20px",color:THEME.mutedText,background:"rgba(15,11,36,0.45)",borderRadius:20,border:`1px solid ${THEME.cardBorder}`,backdropFilter:"blur(12px)",marginTop:10}}>
                    <div style={{fontSize:42,marginBottom:12,filter:"drop-shadow(0 0 12px rgba(139,92,246,0.5))"}}>🏢</div>
                    <p style={{fontSize:16,fontWeight:700,margin:0,color:THEME.highlight}}>Select a floor above to view free halls</p>
                    <p style={{fontSize:12,color:THEME.mutedText,marginTop:6}}>Find vacant classrooms & projector halls instantly</p>
                  </div>
                )}
                {selFloor&&<FreeHallsView key={`${selFloor}-${effPid}`} day={selDay} effectivePid={effPid} curSid={curSid} floor={selFloor} role="student"/>}
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
