    const toMins=([h,m])=>h*60+m;

                <span style={{...bBadge(bg,fg,br),marginLeft:"auto"}}>{list.length}</span>
              </div>
              {list.length===0
                ?<div style={{background:"#0a0f1a",borderRadius:12,padding:12,textAlign:"center",color:"#1e293b",fontSize:13,border:"1px solid #0f1a28"}}>None available</div>
                :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:7}}>
                  {list.map(h=>(
                    <div key={h.id} style={{background:"#0a0f1a",border:`1px solid ${br}40`,borderRadius:12,padding:"11px 13px"}}>
                      <div style={{fontWeight:800,fontSize:14,color:"#f1f5f9",marginBottom:3}}>Hall {h.id}</div>
                      <div style={{display:"flex",alignItems:"center",gap:5}}>
                        <span style={bBadge("#041a0e","#34d399","#065f46")}>✓ FREE</span>
                      </div>
                      {!h.hasData&&<div style={{color:"#1e3a5f",fontSize:9,marginTop:4}}>No schedule</div>}
                    </div>
                  ))}
                </div>
              }
            </div>
          ))}
          {role==="faculty"&&!outside&&!isRest&&busy.length>0&&(
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
                <span style={{color:"#f87171",fontWeight:700,fontSize:12,textTransform:"uppercase",letterSpacing:"0.08em"}}>🔴 Occupied</span>
                <span style={{...bBadge("#1a0505","#f87171","#7f1d1d"),marginLeft:"auto"}}>{busy.length}</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:6}}>
                {busy.map(h=>{
                  const e=h.hasData?getEntry(h.id,day,effectivePid):null;
                  const courseLabel=e&&e.c?(COURSE_NAMES[e.c]||e.c):null;
                  return(
                    <div key={h.id} style={{background:"#060808",border:"1px solid #0f1828",borderRadius:12,padding:"11px 13px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                        <div style={{fontWeight:700,fontSize:14,color:"#94a3b8"}}>Hall {h.id}</div>
                        <span style={{marginLeft:"auto",fontSize:12}}>{h.proj?"📽️":"🪑"}</span>
                      </div>
                      <span style={bBadge("#1a0505","#f87171","#7f1d1d")}>✗ BUSY</span>
                      {courseLabel&&<div style={{color:"#64748b",fontSize:11,marginTop:5,lineHeight:1.3}}>{courseLabel}</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    function App(){
      const [screen,   setScreen]   = useState("landing");
      const [pkInput,  setPkInput]  = useState("");
      const [pkErr,    setPkErr]    = useState(false);
      const [showPK,   setShowPK]   = useState(false);
      const [role,     setRole]     = useState(null);
      const [now,      setNow]      = useState(new Date());
      const [selDay,   setSelDay]   = useState(detectDay);
      const [selFloor, setSelFloor] = useState(null);
      const [selRoom,  setSelRoom]  = useState(null);
      const [curSid,   setCurSid]   = useState(getCurSlotId);
      const [selPid,   setSelPid]   = useState(()=>getCurSlotId()||1);
      const [pidLive,  setPidLive]  = useState(true);
      const [panelAnim,setPanelAnim]= useState(false);

      useEffect(()=>{
        const t=setInterval(()=>{
          const sid=getCurSlotId();setNow(new Date());setCurSid(sid);
          if(pidLive&&sid)setSelPid(sid);
        },1000);
        return()=>clearInterval(t);
      },[pidLive]);

      useEffect(()=>{
        setPanelAnim(false);
        if(selRoom){const t=setTimeout(()=>setPanelAnim(true),40);return()=>clearTimeout(t);}
      },[selRoom]);

      const tStr=now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true});
      const dStr=now.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
      const effPid=pidLive?curSid:selPid;

      function logout(){setScreen("landing");setSelFloor(null);setSelRoom(null);setPkInput("");}
      function goLogin(r){setRole(r);setPkInput("");setPkErr(false);setShowPK(false);setScreen("login");}
      function tryLogin(){
        if((role==="dean"?DEAN_KEY:FACULTY_KEY)===pkInput){setScreen(role);setSelFloor(null);setSelRoom(null);setPkErr(false);}
        else setPkErr(true);
      }

      if(screen==="landing") return(
        <div style={{minHeight:"100vh",background:"#030712",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#f8fafc",padding:24}}>
          <div style={{textAlign:"center",marginBottom:40}}>
            <div style={{fontSize:52,marginBottom:6}}>🏫</div>
            <h1 style={{margin:0,fontSize:36,fontWeight:900,letterSpacing:-1}}>Hall Finder</h1>
            <p style={{margin:"8px 0 0",color:"#475569",fontSize:14}}>SASTRA Deemed University · SRC, Kumbakonam</p>
            <p style={{margin:"3px 0 0",color:"#1e293b",fontSize:12}}>Odd Semester 2026–27 · Floors 1 – 5</p>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:12,width:"100%",maxWidth:390}}>
            {[
              {r:"dean",   emoji:"👑",label:"Dean",    desc:"Full hall overview & schedules",col:"#7c3aed"},
              {r:"faculty",emoji:"🎓",label:"Faculty", desc:"Your schedule & free halls",   col:"#0d9488"},
              {r:"student",emoji:"📚",label:"Students",desc:"Find free halls instantly",     col:"#2563eb"},
            ].map(({r,emoji,label,desc,col})=>(
              <button key={r} onClick={()=>r==="student"?setScreen("student"):goLogin(r)}
                style={{display:"flex",alignItems:"center",gap:14,padding:"17px 20px",borderRadius:16,
                  border:`1px solid ${col}28`,background:`${col}10`,cursor:"pointer",textAlign:"left"}}
                onMouseOver={e=>{e.currentTarget.style.background=`${col}25`;e.currentTarget.style.transform="translateY(-2px)";}}
                onMouseOut={e=>{e.currentTarget.style.background=`${col}10`;e.currentTarget.style.transform="none";}}>
                <div style={{width:50,height:50,borderRadius:14,background:`${col}20`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,flexShrink:0}}>{emoji}</div>
                <div style={{flex:1}}>
                  <div style={{color:"#f1f5f9",fontWeight:700,fontSize:16}}>{label}</div>
                  <div style={{color:"#475569",fontSize:12,marginTop:2}}>{desc}</div>
                </div>
                <div style={{color:col,fontSize:24,fontWeight:200}}>›</div>
              </button>
            ))}
          </div>
        </div>
      );

      if(screen==="login"){
        const col=role==="dean"?"#7c3aed":"#0d9488";
        return(
          <div style={{minHeight:"100vh",background:"#030712",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Segoe UI',system-ui,sans-serif",padding:20}}>
            <div style={{width:"100%",maxWidth:380,background:"#0a0f1a",borderRadius:20,padding:32,border:"1px solid #1e293b"}}>
              <button onClick={()=>setScreen("landing")} style={{...bBtn("#0a0f1a","#475569"),padding:"4px 0",marginBottom:24,fontSize:13}}>‹ Back</button>
              <div style={{textAlign:"center",marginBottom:28}}>
                <div style={{fontSize:44,marginBottom:8}}>{role==="dean"?"👑":"🎓"}</div>
                <h2 style={{margin:0,color:"#f1f5f9",fontSize:22,fontWeight:800}}>{role==="dean"?"Dean Login":"Faculty Login"}</h2>
                <p style={{margin:"6px 0 0",color:"#475569",fontSize:13}}>Enter your passkey to continue</p>
              </div>
              <div style={{position:"relative",marginBottom:pkErr?8:16}}>
                <input type={showPK?"text":"password"} value={pkInput}
                  onChange={e=>{setPkInput(e.target.value);setPkErr(false);}}
                  onKeyDown={e=>e.key==="Enter"&&tryLogin()}
                  placeholder="Enter passkey..."
                  style={{width:"100%",padding:"12px 44px 12px 14px",borderRadius:10,
                    border:`1.5px solid ${pkErr?"#ef4444":"#1e293b"}`,
                    background:"#1e293b",color:"#f1f5f9",fontSize:15,outline:"none",
                    boxSizing:"border-box",fontFamily:"inherit"}}/>
                <button onClick={()=>setShowPK(v=>!v)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16}}>
                  {showPK?"🙈":"👁️"}
                </button>
              </div>
              {pkErr&&<p style={{color:"#ef4444",fontSize:13,textAlign:"center",margin:"0 0 14px"}}>❌ Incorrect passkey. Try again.</p>}
              <button onClick={tryLogin} style={{...bBtn(col),width:"100%",padding:13,fontSize:15,borderRadius:10}}>Login →</button>
            </div>
          </div>
        );
      }

      if(screen==="dean") return(
        <div style={{height:"100vh",background:"#030712",display:"flex",flexDirection:"column",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#f8fafc",overflow:"hidden"}}>
          <div style={{background:"#0a0f1a",borderBottom:"1px solid #1e293b",padding:"11px 20px",flexShrink:0,display:"flex",alignItems:"flex-start",justifyContent:"space-between"}}>
            <div>
              <div style={{fontSize:20,fontWeight:900,color:"#7c3aed",letterSpacing:3,lineHeight:1}}>SRC</div>
              <div style={{fontFamily:"monospace",fontSize:18,fontWeight:700,marginTop:3,color:"#f1f5f9"}}>{tStr}</div>
              <div style={{fontSize:11,color:"#334155",marginTop:1}}>{dStr}</div>
            </div>
            <div style={{textAlign:"center",paddingTop:2}}>
              <div style={{color:"#1e3a5f",fontSize:11,marginBottom:2}}>Viewing</div>
              <div style={{fontSize:17,fontWeight:800,color:"#a78bfa"}}>{DAY_F[selDay]}</div>
            </div>
            <button onClick={logout} style={{...bBtn("#1e293b","#64748b"),padding:"8px 16px",border:"1px solid #334155"}}>Logout</button>
          </div>
          <DayBar selDay={selDay} setSelDay={setSelDay} color="#7c3aed"/>
          <FloorBar selFloor={selFloor} setSelFloor={setSelFloor} onFloorChange={()=>setSelRoom(null)}/>

          <div style={{flex:1,display:"flex",overflow:"hidden"}}>
            <div style={{
              width:selRoom?"20%":180,
              minWidth:selRoom?72:180,
              maxWidth:selRoom?140:180,
              flexShrink:0,borderRight:"1px solid #0f1e30",overflowY:"auto",
              padding:selRoom?"12px 6px":"12px 10px",background:"#06090f",
              transition:"width 0.24s ease, min-width 0.24s ease, max-width 0.24s ease, padding 0.24s ease"
            }}>
              {!selFloor&&<p style={{color:"#1e293b",fontSize:12,textAlign:"center",marginTop:24,lineHeight:1.5}}>Pick a floor<br/>above</p>}
              {selFloor&&!selRoom&&(
                <React.Fragment>
                  <p style={{color:"#1e3a5f",fontSize:10,textTransform:"uppercase",letterSpacing:"0.1em",margin:"0 0 8px 4px"}}>
                    {ordinal(selFloor)} Floor · {floorHalls(selFloor).length} rooms
                  </p>
                  <div style={{display:"flex",flexDirection:"column",gap:5}}>
                    {floorHalls(selFloor).map(hid=>{
                      const h=HALL_INFO[hid];
                      const isSel=selRoom===hid;
                      const curE=typeof curSid==="number"&&hasTimetable(hid)?getEntry(hid,selDay,curSid):null;
                      const curF=curE&&curE.t==="class"?curE.f:null;
                      const occ=curE&&curE.t==="class";
                      return(
                        <button key={hid} onClick={()=>setSelRoom(isSel?null:hid)}
                          style={{width:"100%",textAlign:"left",padding:"9px 10px",borderRadius:10,
                            border:`1px solid ${isSel?"#5b21b6":"#0f1e30"}`,
                            background:isSel?"#120a2e":"transparent",cursor:"pointer"}}>
                          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
                            <div style={{width:7,height:7,borderRadius:"50%",flexShrink:0,
                              background:hasTimetable(hid)?(occ?"#ef4444":"#22c55e"):"#334155",
                              boxShadow:hasTimetable(hid)?`0 0 4px ${occ?"#ef4444":"#22c55e"}`:"none"}}></div>
                            <span style={{color:"#e2e8f0",fontWeight:800,fontSize:13}}>Hall {hid}</span>
                            <span style={{marginLeft:"auto",fontSize:10,flexShrink:0}}>{h.proj?"📽️":"🪑"}</span>
                          </div>
                          <div style={{paddingLeft:14,overflow:"hidden"}}>
                            {hasTimetable(hid)
                              ?<div style={{color:curF?isSel?"#c4b5fd":"#4ade80":"#22c55e",fontSize:10,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                                {curF?"👤 "+curF:"✓ Free now"}
                              </div>
                              :<div style={{color:"#1e293b",fontSize:10}}>No schedule</div>
                            }
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </React.Fragment>
              )}
              {selFloor&&selRoom&&(
                <React.Fragment>
                  <button onClick={()=>setSelRoom(null)} style={{width:"100%",textAlign:"center",padding:"6px 4px",marginBottom:8,borderRadius:8,border:"1px solid #1e293b",background:"transparent",color:"#475569",cursor:"pointer",fontSize:14}}>←</button>
                  <div style={{display:"flex",flexDirection:"column",gap:5}}>
                    {floorHalls(selFloor).map(hid=>{
                      const h=HALL_INFO[hid];
                      const isSel=selRoom===hid;
                      const curE=typeof curSid==="number"&&hasTimetable(hid)?getEntry(hid,selDay,curSid):null;
                      const occ=curE&&curE.t==="class";
                      return(
                        <button key={hid} onClick={()=>setSelRoom(hid)} title={`Hall ${hid}`}
                          style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,
                            padding:"8px 2px",borderRadius:10,
                            border:`1px solid ${isSel?"#5b21b6":"#0f1e30"}`,
                            background:isSel?"#120a2e":"transparent",cursor:"pointer"}}>
                          <div style={{width:6,height:6,borderRadius:"50%",flexShrink:0,
                            background:hasTimetable(hid)?(occ?"#ef4444":"#22c55e"):"#334155",
                            boxShadow:hasTimetable(hid)?`0 0 4px ${occ?"#ef4444":"#22c55e"}`:"none"}}></div>
                          <span style={{color:"#e2e8f0",fontWeight:800,fontSize:12}}>{hid}</span>
                          <span style={{fontSize:12}}>{h.proj?"📽️":"🪑"}</span>
                        </button>
                      );
                    })}
                  </div>
                </React.Fragment>
              )}
            </div>

            <div style={{flex:1,overflowY:"auto",padding:selRoom?"20px 16px":"20px 28px",background:"#030712"}}>
              {!selRoom?(
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:10,userSelect:"none"}}>
                  <div style={{fontSize:52,opacity:.1}}>📋</div>
                  <p style={{color:"#0f1e30",fontSize:16,fontWeight:600,margin:0}}>Select a hall from the left panel</p>
                  <p style={{color:"#0a1420",fontSize:13,margin:0}}>The schedule will appear here</p>
                </div>
              ):(
                <div style={{opacity:panelAnim?1:0,transform:panelAnim?"translateX(0)":"translateX(24px)",transition:"opacity 0.28s ease, transform 0.28s ease"}}>
                  <SchedulePanel hallId={selRoom} day={selDay} curSlotId={curSid}/>
                </div>
              )}
            </div>
          </div>
        </div>
      );

      if(screen==="faculty") return(
        <div style={{minHeight:"100vh",height:"100vh",background:"#030712",display:"flex",flexDirection:"column",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#f8fafc",overflow:"hidden"}}>
          <div style={{background:"#0a0f1a",borderBottom:"1px solid #1e293b",padding:"11px 20px",flexShrink:0,display:"flex",alignItems:"flex-start",justifyContent:"space-between"}}>
            <div>
              <div style={{fontSize:20,fontWeight:900,color:"#0d9488",letterSpacing:3}}>SRC</div>
              <div style={{fontFamily:"monospace",fontSize:18,fontWeight:700,marginTop:3}}>{tStr}</div>
              <div style={{fontSize:11,color:"#334155",marginTop:1}}>{dStr}</div>
            </div>
            <button onClick={logout} style={{...bBtn("#1e293b","#64748b"),padding:"8px 16px",border:"1px solid #334155"}}>Logout</button>
          </div>
          <DayBar selDay={selDay} setSelDay={setSelDay} color="#0d9488"/>
          <div style={{flex:1,overflowY:"auto",padding:18,maxWidth:820,width:"100%",margin:"0 auto",boxSizing:"border-box"}}>
            <h3 style={{color:"#1e3a5f",fontSize:11,textTransform:"uppercase",letterSpacing:"0.09em",margin:"0 0 10px"}}>Hall Availability</h3>
            <PeriodSelector selPid={selPid} setSelPid={setSelPid} isLive={pidLive} setIsLive={setPidLive} curSid={curSid}/>
            <FloorPicker selFloor={selFloor} setSelFloor={setSelFloor} color="#0d9488"/>
            {!selFloor&&<p style={{color:"#1e293b",fontSize:13,textAlign:"center",marginTop:16}}>Select a floor above</p>}
            {selFloor&&<FreeHallsView day={selDay} effectivePid={effPid} curSid={curSid} floor={selFloor} role="faculty"/>}
          </div>
        </div>
      );

      if(screen==="student"){
        const freeCount=selFloor?floorHalls(selFloor).filter(hid=>isHallFree(hid,selDay,effPid)||typeof effPid!=="number").length:0;
        const curSlotObj=ALL_SLOTS.find(s=>s.id===effPid);
        return(
          <div style={{minHeight:"100vh",background:"#030712",display:"flex",flexDirection:"column",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#f8fafc"}}>
            <div style={{background:"linear-gradient(135deg,#0c3255 0%,#1d4ed8 60%,#0d9488 100%)",padding:"16px 18px 22px",flexShrink:0}}>
              <div style={{maxWidth:680,margin:"0 auto"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontSize:22,fontWeight:900,letterSpacing:-0.5}}>🏫 Hall Finder</div>
                    <div style={{color:"rgba(255,255,255,0.55)",fontSize:12,marginTop:2}}>SASTRA SRC · {DAY_F[selDay]}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontFamily:"monospace",fontSize:16,fontWeight:700}}>{tStr}</div>
                    <button onClick={()=>{setScreen("landing");setSelFloor(null);}} style={{...bBtn("rgba(0,0,0,0.25)","rgba(255,255,255,0.6)"),padding:"4px 10px",borderRadius:7,marginTop:5,fontSize:12}}>← Home</button>
                  </div>
                </div>
                <div style={{background:"rgba(0,0,0,0.22)",borderRadius:12,padding:"10px 16px",marginTop:14,display:"flex",gap:28,flexWrap:"wrap"}}>
                  <div><div style={{color:"rgba(255,255,255,0.45)",fontSize:10}}>Free Now</div><div style={{fontSize:22,fontWeight:900}}>{selFloor?freeCount:"—"}</div></div>
                  <div><div style={{color:"rgba(255,255,255,0.45)",fontSize:10}}>Period</div><div style={{fontSize:14,fontWeight:700,color:"#bae6fd",marginTop:3}}>{curSlotObj?.label||"—"}</div></div>
                  <div><div style={{color:"rgba(255,255,255,0.45)",fontSize:10}}>Time</div><div style={{fontSize:12,fontWeight:600,color:"#bae6fd",marginTop:5}}>{curSlotObj?.time||"Outside hrs"}</div></div>
                </div>
              </div>
            </div>
            <div style={{flex:1,overflowY:"auto",padding:16,maxWidth:680,width:"100%",margin:"0 auto",boxSizing:"border-box"}}>
              <PeriodSelector selPid={selPid} setSelPid={setSelPid} isLive={pidLive} setIsLive={setPidLive} curSid={curSid}/>
              <FloorPicker selFloor={selFloor} setSelFloor={setSelFloor} color="#2563eb"/>
              {!selFloor&&<div style={{textAlign:"center",padding:"36px 0",color:"#1e293b"}}>
                <div style={{fontSize:36,marginBottom:10}}>🏢</div>
                <p style={{fontSize:14,fontWeight:600,margin:0,color:"#1e3a5f"}}>Select a floor above</p>
              </div>}
              {selFloor&&<FreeHallsView day={selDay} effectivePid={effPid} curSid={curSid} floor={selFloor} role="student"/>}
            </div>
          </div>
        );
      }

      return null;
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
