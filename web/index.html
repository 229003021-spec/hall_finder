  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #07050f; color: #f8fafc; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #07050f; }
    ::-webkit-scrollbar-thumb { background: #2b1b54; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4c2889; }

    @keyframes studentTakeover {
      0% { opacity: 0; transform: scale(0.96); filter: blur(8px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    @keyframes slideInFromTop {
      0% { opacity: 0; transform: translateY(-28px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInFromBottom {
      0% { opacity: 0; transform: translateY(28px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardPopIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.94); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    html, body {
      overflow-x: hidden;
      max-width: 100vw;
      width: 100%;
    }

    .student-takeover-bg {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at 50% 0%, #1e0938 0%, #07050f 80%);
      animation: studentTakeover 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      max-width: 100vw;
      width: 100%;
    }

    /* Desktop defaults for portal headers */
    .faculty-badge-desktop {
      display: inline-block;
    }
    .faculty-timer-mobile {
      display: none;
    }
    .faculty-timer-center {
      display: block;
      text-align: center;
    }
    .faculty-actions-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .faculty-btn-swapped {
      padding: 7px 14px;
      font-size: 12px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .faculty-btn-logout {
      padding: 7px 16px;
      font-size: 12px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .dean-badge-desktop {
      display: inline-block;
    }
    .dean-timer-mobile {

    .dean-timer-center {

      .faculty-actions-container {

        align-items: flex-end !important;
        gap: 6px !important;
        flex-shrink: 0;
      }
      .faculty-btn-swapped {

      .dean-btn-logout {
        padding: 4px 12px !important;
        font-size: 10px !important;
        border-radius: 12px !important;
      }

      /* Student Portal mobile */
      .student-header-pad {
        padding: 14px 12px 16px !important;
      }
      .student-metrics-bar {
        gap: 8px !important;
        padding: 10px 10px !important;
        display: grid !important;
        grid-template-columns: 1fr 1fr 1fr !important;
        text-align: center;
      }
      .student-metric-divider {
        display: none !important;
      }
      .student-swaps-btn-wrap {
        display: block !important;
        margin-top: 5px !important;
        margin-left: 0 !important;
      }
    }

    .student-banner-anim {
      animation: slideInFromTop 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
    }

    .student-period-anim {
      animation: slideInFromBottom 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }

    .student-floor-anim {
      animation: slideInFromBottom 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
    }

    .student-content-anim {
      animation: slideInFromBottom 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
    }

    .hall-card-anim {
      animation: cardPopIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .hall-card-anim:hover {
      transform: translateY(-3px) scale(1.02);

      border-color: rgba(167, 139, 250, 0.6) !important;
      transition: all 0.2s ease;
    }

    function _decryptPayload(b64Str, key) {
      try {
        const binaryStr = atob(b64Str);
        const bytes = new Uint8Array(binaryStr.length);
        const keyBytes = new TextEncoder().encode(key);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
        }
        const jsonStr = new TextDecoder("utf-8").decode(bytes);
        return JSON.parse(jsonStr);
      } catch(e) {
        console.error("Payload decryption error:", e);
        return { CN: {}, HI: {}, SCH: {} };
      }
    }

    function _encryptPayload(dataObj, key) {
      try {
        const jsonStr = JSON.stringify(dataObj);
        const jsonBytes = new TextEncoder().encode(jsonStr);
        const keyBytes = new TextEncoder().encode(key);
        const bytes = new Uint8Array(jsonBytes.length);
        for (let i = 0; i < jsonBytes.length; i++) {
          bytes[i] = jsonBytes[i] ^ keyBytes[i % keyBytes.length];
        }
        let binaryStr = "";
        const chunkSize = 8192;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          const chunk = bytes.subarray(i, i + chunkSize);
          binaryStr += String.fromCharCode.apply(null, chunk);
        }
        return btoa(binaryStr);
      } catch(e) {
        console.error("Payload encryption error:", e);
        return "";
      }
    }

    const STORAGE_KEY_CUSTOM_TIMETABLE = "HALL_FINDER_CUSTOM_TIMETABLE";
    const _BASE_DATA = _decryptPayload(_SECURE_PAYLOAD, _SECURE_KEY);
    let _ACTIVE_DATA = _BASE_DATA;
    try {
      const _stored = localStorage.getItem(STORAGE_KEY_CUSTOM_TIMETABLE);
      if (_stored) {
        const _parsed = JSON.parse(_stored);
        if (_parsed && _parsed.SCH && Object.keys(_parsed.SCH).length > 0) {
          _ACTIVE_DATA = _parsed;
        }
      }
    } catch(e) {
      console.warn("Storage read error:", e);
    }

    const COURSE_NAMES = _ACTIVE_DATA.CN || _BASE_DATA.CN || {};
    const HALL_INFO = _ACTIVE_DATA.HI || _BASE_DATA.HI || {};
    const SCH = _ACTIVE_DATA.SCH || _BASE_DATA.SCH || {};

    const ALL_SLOTS = [
      {id:1,    label:"P1",    time:"8:45 – 9:45 AM",   start:[8,45], end:[9,45], ptype:"period"},
      {id:2,    label:"P2",    time:"9:45 – 10:45 AM",  start:[9,45], end:[10,45],ptype:"period"},

      {id:3,    label:"P3",    time:"11:00 AM – 12 PM", start:[11,0], end:[12,0], ptype:"period"},
      {id:4,    label:"P4",    time:"12:00 – 1:00 PM",  start:[12,0], end:[13,0], ptype:"period"},
      {id:"ln", label:"Lunch", time:"1:00 – 2:00 PM",   start:[13,0], end:[14,0], ptype:"lunch"},
      {id:6,    label:"P6",    time:"2:00 – 3:00 PM",   start:[14,0], end:[15,0], ptype:"period"},
      {id:"b2", label:"Break", time:"3:00 – 3:15 PM",   start:[15,0], end:[15,15],ptype:"break"},
      {id:7,    label:"P7",    time:"3:15 – 4:15 PM",   start:[15,15],end:[16,15],ptype:"period"},
      {id:8,    label:"P8",    time:"4:15 – 5:15 PM",   start:[16,15],end:[17,15],ptype:"period"},
    ];

    const DAYS=["MON","TUE","WED","THU","FRI"];
    const DAY_S={MON:"Mon",TUE:"Tue",WED:"Wed",THU:"Thu",FRI:"Fri"};
    const DAY_F={MON:"Monday",TUE:"Tuesday",WED:"Wednesday",THU:"Thursday",FRI:"Friday"};

    const toMins=([h,m])=>h*60+m;
    const detectDay=()=>{const d=["SUN","MON","TUE","WED","THU","FRI","SAT"][new Date().getDay()];return DAYS.includes(d)?d:"MON";};
    const getCurSlotId=()=>{const m=new Date().getHours()*60+new Date().getMinutes();for(const s of ALL_SLOTS)if(m>=toMins(s.start)&&m<toMins(s.end))return s.id;return null;};
    const getEntry=(hid,day,pid)=>SCH[hid]?.[day]?.[pid]||{t:"free",n:""};
    const hasTimetable=hid=>!!SCH[hid];
    const isHallFree=(hid,day,sid)=>{
      if(!SCH[hid])return true;
      const e=getEntry(hid,day,sid);
      return !e||e.t==="free"||e.t==="lab"||e.t==="lunch";
    };
    const floorHalls=f=>Object.keys(HALL_INFO).filter(id=>Number(HALL_INFO[id].floor)===Number(f)).sort((a,b)=>String(a).localeCompare(String(b), undefined, {numeric: true}));
    const ordinal=n=>Number(n)===0?"Ground":n+(Number(n)===1?"st":Number(n)===2?"nd":Number(n)===3?"rd":"th");
    const getAvailableFloors=()=>{
      const fls=new Set([1,2,3,4,5]);
      Object.values(HALL_INFO).forEach(h=>{
        if(typeof h.floor==="number") fls.add(h.floor);
        else if(h.floor!==undefined&&!isNaN(parseInt(h.floor))) fls.add(parseInt(h.floor));
      });
      return Array.from(fls).sort((a,b)=>a-b);
    };
    const bBtn=(bg,fg="#fff",extra={})=>({background:bg,border:"none",color:fg,borderRadius:10,cursor:"pointer",fontWeight:700,fontSize:13,transition:"all .15s",...extra});
    const bBadge=(bg,fg,br)=>({background:bg,border:`1px solid ${br}`,color:fg,borderRadius:12,fontSize:11,padding:"2px 9px",fontWeight:600,display:"inline-flex",alignItems:"center",gap:4});

    // Keep a mutable pristine copy of decrypted schedule for clean rollbacks, swaps and daily resets
    let _PRISTINE_SCH = JSON.parse(JSON.stringify(SCH));

    // Daily persistence key & helpers (Swaps strictly persist only until the end of the current working day)
    const STORAGE_KEY_DAILY_SWAPS = "HALL_FINDER_DAILY_SWAPS";
    const SERVER_SYNC_URL = "https://ntfy.sh/sastra_src_hall_finder_live_229003021";

    function getTodayDateStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dt = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${dt}`;
    }

    function getEndOfDayTimestamp() {
      const end = new Date();
      end.setHours(23, 59, 59, 999);
      return end.getTime();
    }

    function resetSCHToPristine() {
      for (const hid in SCH) {
        delete SCH[hid];
      }
      for (const hid in _PRISTINE_SCH) {
        SCH[hid] = JSON.parse(JSON.stringify(_PRISTINE_SCH[hid]));
      }
    }

    // Sync swaps to cloud server (persists across all devices: mobile, laptop, desktop)
    async function syncSwapsToServer(swaps) {
      try {
        const today = getTodayDateStr();
        const payload = JSON.stringify({
          date: today,
          day: detectDay(),
          expiresAt: getEndOfDayTimestamp(),
          swaps: swaps || []
        });
        await fetch(SERVER_SYNC_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: payload
        });
      } catch (err) {
        console.warn("Server sync error:", err);
      }
    }

    // Fetch latest swaps from cloud server
    async function fetchServerSwaps() {
      try {
        const res = await fetch(`${SERVER_SYNC_URL}/json?poll=1&since=24h`, {
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) return null;
        const raw = await res.text();
        const lines = raw.split("\n");
        let lastMsg = null;
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;
          try {
            const obj = JSON.parse(line);
            if (obj && obj.event === "message" && obj.message) {
              lastMsg = JSON.parse(obj.message);
            }
          } catch (e) {}
        }
        const today = getTodayDateStr();
        if (lastMsg && lastMsg.date === today && Date.now() <= (lastMsg.expiresAt || Infinity)) {
          return Array.isArray(lastMsg.swaps) ? lastMsg.swaps : [];
        }
        return null;
      } catch (err) {
        console.warn("Fetch server swaps error:", err);
        return null;
      }
    }

    function applySingleSwapToSCH(swap) {
      const { type, day, effectivePid, targetHid } = swap;
      if (!SCH[targetHid]) SCH[targetHid] = {};
      if (!SCH[targetHid][day]) SCH[targetHid][day] = {};

      if (type === "swap") {
        const { fromHid } = swap;
        if (!SCH[fromHid]) SCH[fromHid] = {};
        if (!SCH[fromHid][day]) SCH[fromHid][day] = {};

        const curTarget = SCH[targetHid][day][effectivePid] ? { ...SCH[targetHid][day][effectivePid] } : { t: "free", n: "" };
        const curFrom = SCH[fromHid][day][effectivePid] ? { ...SCH[fromHid][day][effectivePid] } : { t: "free", n: "" };

        SCH[targetHid][day][effectivePid] = curFrom;
        SCH[fromHid][day][effectivePid] = curTarget;
      } else if (type === "free_move") {
        const { fromHid } = swap;
        if (!SCH[fromHid]) SCH[fromHid] = {};
        if (!SCH[fromHid][day]) SCH[fromHid][day] = {};

        const curFrom = SCH[fromHid][day][effectivePid] ? { ...SCH[fromHid][day][effectivePid] } : { t: "free", n: "" };

        // Move class into the free target hall
        SCH[targetHid][day][effectivePid] = {
          ...curFrom,
          n: `Moved from Hall ${fromHid}`
        };

        // Vacate fromHid and mark as free
        SCH[fromHid][day][effectivePid] = {
          t: "free",
          n: `Vacated to Hall ${targetHid}`
        };
      } else if (type === "extra") {
        const { freeShiftHid, faculty, courseCode, courseName } = swap;
        const curTarget = SCH[targetHid][day][effectivePid] ? { ...SCH[targetHid][day][effectivePid] } : { t: "free", n: "" };

        if (freeShiftHid) {
          if (!SCH[freeShiftHid]) SCH[freeShiftHid] = {};
          if (!SCH[freeShiftHid][day]) SCH[freeShiftHid][day] = {};
          // Regular class shifts to free hall
          SCH[freeShiftHid][day][effectivePid] = {
            ...curTarget,
            n: `Shifted from Hall ${targetHid}`
          };
        }

        // Extra class takes target hall
        SCH[targetHid][day][effectivePid] = {
          t: "class",
          c: courseCode,
          f: faculty,
          n: "Extra Class"
        };

        if (courseName && !COURSE_NAMES[courseCode]) {
          COURSE_NAMES[courseCode] = courseName;
        }
      }
    }

    function applySwapsList(swapsList) {
      resetSCHToPristine();
      if (Array.isArray(swapsList)) {
        for (const s of swapsList) {
          applySingleSwapToSCH(s);
        }
      }
    }

    function loadDailySwaps() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_DAILY_SWAPS);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        const today = getTodayDateStr();
        // Check if swaps belong to today and haven't expired
        if (parsed && parsed.date === today && Date.now() <= (parsed.expiresAt || Infinity)) {
          return Array.isArray(parsed.swaps) ? parsed.swaps : [];
        } else {
          // Expired for next/new day
          localStorage.removeItem(STORAGE_KEY_DAILY_SWAPS);
          return [];
        }
      } catch (err) {
        console.error("Error loading daily swaps:", err);
        return [];
      }
    }

    function saveDailySwaps(swaps) {
      try {
        if (!swaps || swaps.length === 0) {
          localStorage.removeItem(STORAGE_KEY_DAILY_SWAPS);
        } else {
          const today = getTodayDateStr();
          const data = {
            date: today,
            day: detectDay(),
            expiresAt: getEndOfDayTimestamp(),
            swaps: swaps
          };
          localStorage.setItem(STORAGE_KEY_DAILY_SWAPS, JSON.stringify(data));
        }
      } catch (err) {
        console.error("Error saving daily swaps:", err);
      }
      // Also broadcast and persist to cloud server for mobile & laptop synchronization
      syncSwapsToServer(swaps);
    }

    // On initial load, apply any active daily swaps for today
    const _INITIAL_DAILY_SWAPS = loadDailySwaps();
    if (_INITIAL_DAILY_SWAPS.length > 0) {
      applySwapsList(_INITIAL_DAILY_SWAPS);
    }

    function VideoBg() {
      const canvasRef = React.useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const onResize = () => {
          if (!canvas) return;
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', onResize);

        const pts = Array.from({ length: 50 }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 2 + 0.5,
          dx: (Math.random() - 0.5) * 0.5,
          dy: (Math.random() - 0.5) * 0.5,
          a: Math.random() * 0.6 + 0.2
        }));

        const draw = () => {
          ctx.clearRect(0, 0, w, h);
          pts.forEach(p => {
            p.x += p.dx; p.y += p.dy;
            if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(167, 139, 250, ${p.a})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#8b5cf6';
            ctx.fill();
          });
          animId = requestAnimationFrame(draw);
        };
        draw();
        return () => {
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(animId);
        };
      }, []);

      return (
        <div style={{
          position: "fixed", top: 0, left: 0, width: "100vw", height: "100vh",
          overflow: "hidden", zIndex: 0, pointerEvents: "none"
        }}>
          <canvas ref={canvasRef} style={{
            position: "absolute", top: 0, left: 0, width: "100%", height: "100%",
            zIndex: 1, background: "transparent"
          }} />
          <video autoPlay loop muted playsInline style={{
            position: "absolute", top: 0, left: 0, width: "100%", height: "100%",
            objectFit: "cover", zIndex: 0, filter: "brightness(0.35) contrast(1.15) saturate(1.3)"
          }}>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4" type="video/mp4" />
            <source src="https://cdn.coverr.co/videos/coverr-digital-lines-and-dots-5412/1080p.mp4" type="video/mp4" />
          </video>
          <div style={{
            position: "absolute", inset: 0, zIndex: 2,
            background: "radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.18) 0%, rgba(7, 5, 15, 0.85) 75%)",
            backdropFilter: "blur(2px)"
          }}></div>
        </div>
      );
    }

    function FloorBar({selFloor,setSelFloor,onFloorChange}){

      return(

          {availableFloors.map(f=>{

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{padding: 24, background: "rgba(239,68,68,0.1)", border: "1px solid #ef4444", borderRadius: 16, textAlign: "center", color: "#fca5a5", margin: "20px auto", maxWidth: 500}}>
              <div style={{fontSize: 32, marginBottom: 8}}>⚠️</div>
              <h3 style={{color: "#f87171", fontSize: 16, fontWeight: 800, margin: "0 0 6px"}}>Something went wrong rendering this view</h3>
              <p style={{fontSize: 12, color: "#cbd5e1", margin: "0 0 14px"}}>Please try selecting another floor or reload.</p>
              <button onClick={() => this.setState({ hasError: false, error: null })} style={{background: "#7c3aed", color: "#fff", border: "none", borderRadius: 8, padding: "8px 18px", fontSize: 12, fontWeight: 700, cursor: "pointer"}}>
                ↻ Try Again
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function ReservationModal({targetHid, day, effectivePid, onClose, onApplySwap}){
      const targetIsFree = isHallFree(targetHid, day, effectivePid);
      const [mode, setMode] = useState(targetIsFree ? "move" : "swap"); // "swap" | "move" | "extra"
      const [swapFromHid, setSwapFromHid] = useState("");
      const [freeShiftHid, setFreeShiftHid] = useState("");
      const [extraFaculty, setExtraFaculty] = useState("");
      const [extraCourseCode, setExtraCourseCode] = useState("");
      const [extraCourseName, setExtraCourseName] = useState("");
      const [errorMsg, setErrorMsg] = useState("");

      const slot = ALL_SLOTS.find(s=>s.id===effectivePid);
      const targetEntry = getEntry(targetHid, day, effectivePid);
      const targetHallInfo = HALL_INFO[targetHid] || {proj: false, floor: 1};
      const targetFac = targetEntry.f || "Regular Faculty";
      const targetCourseCode = targetEntry.c || "";
      const targetCourseName = targetCourseCode ? (COURSE_NAMES[targetCourseCode] || targetCourseCode) : "Regular Class";

      const todayDay = detectDay();
      const isAllowedToday = (day === todayDay);

      // Find all free halls across all floors at this instance (excluding target)
      const allFreeHalls = Object.keys(HALL_INFO).filter(id => id !== targetHid && isHallFree(id, day, effectivePid)).sort((a,b)=>+a-+b);

      // Occupied halls (for user selection to move/swap from)
      const otherOccupiedHalls = Object.keys(HALL_INFO).filter(id => id !== targetHid && !isHallFree(id, day, effectivePid)).sort((a,b)=>+a-+b);

      // Handle Course Code input
      const handleCourseCodeChange = (e) => {
        const code = e.target.value.toUpperCase();
        setExtraCourseCode(code);
        if (COURSE_NAMES[code]) {
          setExtraCourseName(COURSE_NAMES[code]);
        }
      };

      const fromHallInfo = HALL_INFO[swapFromHid];
      const fromEntry = swapFromHid ? getEntry(swapFromHid, day, effectivePid) : null;
      const fromFac = fromEntry?.f || "Your Faculty";
      const fromCourseCode = fromEntry?.c || "";
      const fromCourseName = fromCourseCode ? (COURSE_NAMES[fromCourseCode] || fromCourseCode) : "Class";

      const handleConfirm = () => {
        setErrorMsg("");
        if (!isAllowedToday) {
          setErrorMsg(`Reservations & swapping are strictly permitted for today (${DAY_F[todayDay]}) only. Swapping for ${DAY_F[day]} is not allowed.`);
          return;
        }

        if (targetIsFree && mode === "move") {
          const fromHid = swapFromHid.trim();
          if (!fromHid) {
            setErrorMsg("Please enter or select your dealing Hall number (YYY) to move from.");
            return;
          }
          if (fromHid === targetHid) {
            setErrorMsg("Cannot move a hall into itself. Please specify another hall.");
            return;
          }
          if (!HALL_INFO[fromHid]) {
            setErrorMsg(`Hall ${fromHid} does not exist in the system.`);
            return;
          }
          onApplySwap({
            type: "free_move",
            targetHid,
            fromHid,
            day,
            effectivePid
          });
          onClose();
        } else if (!targetIsFree && mode === "swap") {
          const fromHid = swapFromHid.trim();
          if (!fromHid) {
            setErrorMsg("Please enter or select your dealing Hall number (YYY).");
            return;
          }
          if (fromHid === targetHid) {
            setErrorMsg("Cannot swap a hall with itself. Please specify another hall.");
            return;
          }
          if (!HALL_INFO[fromHid]) {
            setErrorMsg(`Hall ${fromHid} does not exist in the system.`);
            return;
          }
          onApplySwap({
            type: "swap",
            targetHid,
            fromHid,
            day,
            effectivePid
          });
          onClose();
        } else {
          // Extra class
          if (!targetIsFree && !freeShiftHid) {
            setErrorMsg("Please select a Free Hall to shift the regular class into.");
            return;
          }
          if (!extraFaculty.trim()) {
            setErrorMsg("Please enter your Faculty Name.");
            return;
          }
          if (!extraCourseCode.trim()) {
            setErrorMsg("Please enter the Course Code.");
            return;
          }
          onApplySwap({
            type: "extra",
            targetHid,
            freeShiftHid: targetIsFree ? null : freeShiftHid,
            faculty: extraFaculty.trim(),
            courseCode: extraCourseCode.trim(),
            courseName: extraCourseName.trim() || COURSE_NAMES[extraCourseCode.trim()] || extraCourseCode.trim(),
            day,
            effectivePid
          });
          onClose();
        }
      };

      return(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(4,2,14,0.85)",backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>

                <div style={{fontSize:10,color:"#34d399",fontWeight:800,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:3}}>Hall {targetHid} Status</div>

    function FreeHallsView({day,effectivePid,curSid,floor,role,onApplySwap}){
      const [expandedBusyHid, setExpandedBusyHid] = useState(null);
      const [expandedFreeHid, setExpandedFreeHid] = useState(null);
      const [resModalHid, setResModalHid] = useState(null);
      const clickTimers = React.useRef ? React.useRef({}) : { current: {} };

      const handleFreeClick = (e, hid) => {
        if (role !== "faculty" || outside || isRest) return;
        const now = Date.now();
        const times = (clickTimers.current[hid] || []).filter(t => now - t < 700);
        times.push(now);
        clickTimers.current[hid] = times;

        if (e.detail >= 3 || times.length >= 3) {
          clickTimers.current[hid] = [];
          setResModalHid(hid);
          return;
        }

        setExpandedFreeHid(expandedFreeHid === hid ? null : hid);
      };

      const handleBusyClick = (e, hid) => {
        const now = Date.now();
        const times = (clickTimers.current[hid] || []).filter(t => now - t < 700);
        times.push(now);
        clickTimers.current[hid] = times;

        if (e.detail >= 3 || times.length >= 3) {
          clickTimers.current[hid] = [];
          if (role === "faculty") {
            setResModalHid(hid);
          }
          return;
        }

        setExpandedBusyHid(expandedBusyHid === hid ? null : hid);
      };
      const slot=ALL_SLOTS.find(s=>s.id===effectivePid);
      const isRest=slot&&(slot.ptype==="break"||slot.ptype==="lunch");
      const outside=!effectivePid;
      const halls=floorHalls(floor).map(hid=>({
        id:hid,...HALL_INFO[hid],
        free:isRest||outside||isHallFree(hid,day,effectivePid),
        hasData:hasTimetable(hid),
      }));
      const fp=halls.filter(h=>h.free&&h.proj);
      const fn=halls.filter(h=>h.free&&!h.proj);
      const busy=halls.filter(h=>!h.free);
      return(
        <div>
          {outside&&<div style={{background:THEME.cardBg,border:`1px solid ${THEME.cardBorder}`,borderRadius:14,padding:22,textAlign:"center",marginBottom:14}}>
            <div style={{fontSize:28,marginBottom:6}}>🌙</div>
            <p style={{color:THEME.mutedText,fontWeight:600,margin:0}}>Outside College Hours</p>
            <p style={{color:THEME.mutedText,fontSize:12,margin:"4px 0 0",opacity:0.8}}>Select a period above to check availability</p>
          </div>}
          {isRest&&<div style={{background:"#170e03",border:"1px solid #78350f",borderRadius:14,padding:14,textAlign:"center",marginBottom:14}}>
            <p style={{color:"#fbbf24",fontWeight:700,margin:0,fontSize:14}}>{slot.ptype==="lunch"?"🍱":"☕"} {slot.label} · All halls are free!</p>
          </div>}
          {[{list:fp,icon:"📽️",label:"Free · With Projector",fg:"#5eead4",bg:"#042f2e",br:"#0d9488"},

      }, [toastMsg]);

      // Cloud server synchronization (SSE + fetch + poll + visibility change + storage event)
      useEffect(() => {
        let isMounted = true;

        // 1. Cross-tab synchronization via localStorage storage event
        const handleStorageChange = (e) => {
          if (e.key === STORAGE_KEY_DAILY_SWAPS) {
            const updated = loadDailySwaps();
            applySwapsList(updated);
            setActiveSwaps(updated);
            setSwapVersion(v => v + 1);
          }
        };
        window.addEventListener("storage", handleStorageChange);

        // 2. Fetch latest server state on app mount
        fetchServerSwaps().then(serverSwaps => {
          if (!isMounted) return;
          if (serverSwaps && Array.isArray(serverSwaps)) {
            setActiveSwaps(prev => {
              if (JSON.stringify(prev) !== JSON.stringify(serverSwaps)) {
                applySwapsList(serverSwaps);
                setSwapVersion(v => v + 1);
                return serverSwaps;
              }
              return prev;
            });
          }
        });

        // 3. Connect to live Server-Sent Events (SSE) for instant cross-device updates
        let es = null;
        try {
          es = new EventSource(`${SERVER_SYNC_URL}/sse`);
          es.onmessage = (event) => {
            if (!isMounted || !event.data) return;
            try {
              const obj = JSON.parse(event.data);
              if (obj && obj.event === "message" && obj.message) {
                const payload = JSON.parse(obj.message);
                const today = getTodayDateStr();
                if (payload && payload.date === today && Date.now() <= (payload.expiresAt || Infinity)) {
                  const newSwaps = Array.isArray(payload.swaps) ? payload.swaps : [];
                  setActiveSwaps(prev => {
                    if (JSON.stringify(prev) !== JSON.stringify(newSwaps)) {
                      applySwapsList(newSwaps);
                      setSwapVersion(v => v + 1);
                      return newSwaps;
                    }
                    return prev;
                  });
                  try {
                    if (newSwaps.length === 0) {
                      localStorage.removeItem(STORAGE_KEY_DAILY_SWAPS);
                    } else {
                      localStorage.setItem(STORAGE_KEY_DAILY_SWAPS, JSON.stringify(payload));
                    }
                  } catch (e) {}
                }
              }
            } catch (err) {}
          };
        } catch (err) {
          console.warn("SSE connection error:", err);
        }

        // 4. Background polling every 12 seconds as a reliable backup
        const pollTimer = setInterval(() => {
          fetchServerSwaps().then(serverSwaps => {
            if (!isMounted) return;
            if (serverSwaps && Array.isArray(serverSwaps)) {
              setActiveSwaps(prev => {
                if (JSON.stringify(prev) !== JSON.stringify(serverSwaps)) {
                  applySwapsList(serverSwaps);
                  setSwapVersion(v => v + 1);
                  return serverSwaps;
                }
                return prev;
              });
            }
          });
        }, 12000);

        // 5. Instant check on visibility change (when unlocking mobile or switching browser tabs)
        const handleVisibilityChange = () => {
          if (document.visibilityState === "visible") {
            fetchServerSwaps().then(serverSwaps => {
              if (!isMounted) return;
              if (serverSwaps && Array.isArray(serverSwaps)) {
                setActiveSwaps(prev => {
                  if (JSON.stringify(prev) !== JSON.stringify(serverSwaps)) {
                    applySwapsList(serverSwaps);
                    setSwapVersion(v => v + 1);
                    return serverSwaps;
                  }
                  return prev;
                });
              }
            });
          }
        };
        document.addEventListener("visibilitychange", handleVisibilityChange);

        return () => {
          isMounted = false;
          window.removeEventListener("storage", handleStorageChange);
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          if (es) es.close();
          clearInterval(pollTimer);
        };
      }, []);

          desc = `Moved class from Hall ${payload.fromHid} → Hall ${targetHid} (Hall ${payload.fromHid} vacated)`;
        } else {

          } else {

        const swapRecord = {

      function downloadFloorTemplate(floorNum) {
        const halls = floorHalls(floorNum);
        const floorSCH = {};
        const floorCN = {};
        const floorHI = {};

        halls.forEach(hid => {
          if (SCH[hid]) floorSCH[hid] = SCH[hid];
          if (HALL_INFO[hid]) floorHI[hid] = HALL_INFO[hid];
          if (SCH[hid]) {
            Object.values(SCH[hid]).forEach(daySlots => {
              Object.values(daySlots).forEach(slot => {
                if (slot && slot.c && COURSE_NAMES[slot.c]) {
                  floorCN[slot.c] = COURSE_NAMES[slot.c];
                }
              });
            });
          }
        });

        const exportPayload = {
          floor: floorNum,
          description: `Floor ${floorNum} Timetable Data for Hall Finder`,
          exportedAt: new Date().toISOString(),
          HI: floorHI,
          CN: floorCN,
          SCH: floorSCH
        };

        const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `floor_${floorNum}_timetable.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function downloadHallTemplate(hid, floorNum, hasProj) {
        const cleanHid = String(hid).trim();
        if (!cleanHid) return;
        const existingSched = SCH[cleanHid] || {};
        const floor = HALL_INFO[cleanHid]?.floor !== undefined ? Number(HALL_INFO[cleanHid].floor) : (floorNum !== undefined && floorNum !== "" ? Number(floorNum) : 1);
        const proj = HALL_INFO[cleanHid]?.proj !== undefined ? Boolean(HALL_INFO[cleanHid].proj) : (hasProj !== undefined ? Boolean(hasProj) : false);

        const hallCN = {};
        if (SCH[cleanHid]) {
          Object.values(SCH[cleanHid]).forEach(daySlots => {
            Object.values(daySlots).forEach(slot => {
              if (slot && slot.c && COURSE_NAMES[slot.c]) {
                hallCN[slot.c] = COURSE_NAMES[slot.c];
              }
            });
          });
        }

        let sched = existingSched;
        if (!SCH[cleanHid] || Object.keys(existingSched).length === 0) {
          sched = {};
          DAYS.forEach(day => {
            sched[day] = {};
            ALL_SLOTS.forEach(slot => {
              sched[day][String(slot.id)] = { t: "free", n: "" };
            });
          });
        }

        const exportPayload = {
          hall: cleanHid,
          floor: floor,
          proj: proj,
          description: `Timetable Data for Hall ${cleanHid} (${ordinal(floor)} Floor)`,
          exportedAt: new Date().toISOString(),
          CN: hallCN,
          schedule: sched
        };

        const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `hall_${cleanHid}_timetable.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

        if (!file) return;

          setUploadError("Please upload a file with a .json extension.");
          return;
        }

        const isHallMode = targetFloor === "hall" || !!specificHallInfo;
        if (isHallMode && (!specificHallInfo || !specificHallInfo.hid)) {
          setUploadError("Please select or enter a hall number first before uploading.");
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const rawText = e.target.result;
            const json = JSON.parse(rawText);

            let rawCN = json.CN || {};
            let rawHI = json.HI || {};

            if (isHallMode) {
              const targetHid = String(specificHallInfo.hid).trim();
              const targetFloorVal = Number(specificHallInfo.floor);
              const targetProjVal = Boolean(specificHallInfo.proj);

              // Extract schedule for single hall
              let hallSched = null;
              if (json.schedule && typeof json.schedule === "object") {
                hallSched = json.schedule;
              } else if (json.SCH && typeof json.SCH === "object") {
                hallSched = json.SCH[targetHid] || Object.values(json.SCH)[0];
              } else if (json[targetHid] && typeof json[targetHid] === "object") {
                hallSched = json[targetHid];
              } else if (DAYS.some(d => json[d] || json[DAY_F[d]])) {
                hallSched = json;
              } else if (typeof json === "object" && Object.keys(json).length > 0) {
                const firstVal = Object.values(json)[0];
                if (typeof firstVal === "object" && DAYS.some(d => firstVal[d] || firstVal[DAY_F[d]])) {
                  hallSched = firstVal;
                }
              }

              if (!hallSched || typeof hallSched !== "object") {
                setUploadError(`Could not find a valid schedule for Hall ${targetHid} in the uploaded JSON. Expected days like "Monday" or "MON" with period slots.`);
                return;
              }

              let totalSlots = 0;
              let freeSlots = 0;
              let classSlots = 0;
              let labSlots = 0;
              const validHallsToUpdate = { [targetHid]: {} };
              const newCourseCodesFound = [];
              const warnings = [];

              DAYS.forEach(day => {
                const fullDayName = DAY_F[day];
                const dayObj = hallSched[day] || hallSched[fullDayName] || hallSched[day.toLowerCase()] || hallSched[fullDayName.toLowerCase()] || {};
                validHallsToUpdate[targetHid][day] = {};

                ALL_SLOTS.forEach(slot => {
                  const sid = String(slot.id);
                  const entry = dayObj[sid] || dayObj[slot.label] || dayObj["Period " + sid] || { t: "free", n: "" };
                  validHallsToUpdate[targetHid][day][sid] = entry;
                  totalSlots++;

                  if (entry.t === "free" || !entry.t) freeSlots++;
                  else if (entry.t === "lab") labSlots++;
                  else classSlots++;

                  if (entry.c) {
                    if (entry.n && !rawCN[entry.c]) rawCN[entry.c] = entry.n;
                    if (!COURSE_NAMES[entry.c] && !rawCN[entry.c] && !newCourseCodesFound.includes(entry.c)) {
                      newCourseCodesFound.push(entry.c);
                    }
                  }
                });
              });

              rawHI[targetHid] = {
                floor: targetFloorVal,
                proj: targetProjVal
              };

              setParsedUpload({
                fileName: file.name,
                mode: "hall",
                targetHall: targetHid,
                targetFloor: targetFloorVal,
                targetProj: targetProjVal,
                isNewHall: specificHallInfo.isNew,
                hallsToUpdate: validHallsToUpdate,
                hallList: [targetHid],
                newCN: rawCN,
                newHI: rawHI,
                stats: {
                  hallCount: 1,
                  totalSlots,
                  freeSlots,
                  classSlots,
                  labSlots,
                  newCourses: newCourseCodesFound
                },
                warnings
              });
              setSelectedPreviewHall(targetHid);
              setUploadedFile(file);
              return;
            }

            // Existing Floor Mode (Floors 1-5)
            let rawSCH = {};
            if (json.SCH && typeof json.SCH === "object") {
              rawSCH = json.SCH;
            } else if (json.halls && typeof json.halls === "object") {
              rawSCH = json.halls;
            } else if (typeof json === "object" && !json.SCH && !json.floor) {
              rawSCH = json;
            } else if (Array.isArray(json)) {
              json.forEach(item => {
                if (item && (item.hid || item.hall)) {
                  rawSCH[item.hid || item.hall] = item.schedule || item;
                }
              });
            }

            const hallKeys = Object.keys(rawSCH).filter(k => !["CN","HI","floor","description","exportedAt"].includes(k));
            if (hallKeys.length === 0) {
              setUploadError("No hall schedules found in the JSON file. Please ensure your JSON contains hall room numbers (e.g., '501', '502').");
              return;
            }

            const targetFloorHalls = floorHalls(targetFloor);
            const matchingHalls = [];
            const nonMatchingHalls = [];
            const warnings = [];

            hallKeys.forEach(hid => {
              const hFloor = HALL_INFO[hid]?.floor !== undefined ? Number(HALL_INFO[hid].floor) : parseInt(String(hid).charAt(0));
              if (hFloor === Number(targetFloor) || targetFloorHalls.includes(hid)) {
                matchingHalls.push(hid);
              } else {
                nonMatchingHalls.push(hid);
              }
            });

            if (matchingHalls.length === 0) {
              setUploadError(`None of the halls in this file belong to Floor ${targetFloor}. Found halls: ${hallKeys.join(", ")}. Please select the correct floor.`);
              return;
            }

            if (nonMatchingHalls.length > 0) {
              warnings.push(`File contains halls belonging to other floors (${nonMatchingHalls.join(", ")}). Only the ${matchingHalls.length} halls on Floor ${targetFloor} will be updated.`);
            }

            let totalSlots = 0;
            let freeSlots = 0;
            let classSlots = 0;
            let labSlots = 0;
            const validHallsToUpdate = {};
            const newCourseCodesFound = [];

            matchingHalls.sort((a,b)=>String(a).localeCompare(String(b), undefined, {numeric: true})).forEach(hid => {
              const hallSched = rawSCH[hid];
              if (typeof hallSched !== "object") return;
              validHallsToUpdate[hid] = {};

              DAYS.forEach(day => {
                const fullDayName = DAY_F[day];
                const dayObj = hallSched[day] || hallSched[fullDayName] || {};
                validHallsToUpdate[hid][day] = {};

                ALL_SLOTS.forEach(slot => {
                  const sid = String(slot.id);
                  const entry = dayObj[sid] || dayObj[slot.label] || { t: "free", n: "" };
                  validHallsToUpdate[hid][day][sid] = entry;
                  totalSlots++;

                  if (entry.t === "free" || !entry.t) freeSlots++;
                  else if (entry.t === "lab") labSlots++;
                  else classSlots++;

                  if (entry.c) {
                    if (entry.n && !rawCN[entry.c]) rawCN[entry.c] = entry.n;
                    if (!COURSE_NAMES[entry.c] && !rawCN[entry.c] && !newCourseCodesFound.includes(entry.c)) {
                      newCourseCodesFound.push(entry.c);
                    }
                  }
                });
              });
            });

            setParsedUpload({
              fileName: file.name,
              mode: "floor",
              targetFloor,
              hallsToUpdate: validHallsToUpdate,
              hallList: matchingHalls,
              newCN: rawCN,
              newHI: rawHI,
              stats: {
                hallCount: matchingHalls.length,
                totalSlots,
                freeSlots,
                classSlots,
                labSlots,
                newCourses: newCourseCodesFound
              },
              warnings
            });
            setSelectedPreviewHall(matchingHalls[0] || null);
            setUploadedFile(file);
          } catch (err) {
            setUploadError("Invalid JSON syntax: " + err.message);
          }
        };
        reader.readAsText(file);
      }

      async function executeCommit(parsedData) {
        if (!parsedData) return;
        setIsCommitting(true);
        const isHallMode = parsedData.mode === "hall";
        const descTarget = isHallMode 
          ? `Hall ${parsedData.targetHall} (Floor ${parsedData.targetFloor})` 
          : `Floor ${parsedData.targetFloor}`;

        setCommitLog([`▶ Initializing commit for ${descTarget}...`]);

        const updatedSCH = { ...SCH };
        const updatedCN = { ...COURSE_NAMES, ...parsedData.newCN };
        const updatedHI = { ...HALL_INFO, ...parsedData.newHI };

        Object.entries(parsedData.hallsToUpdate).forEach(([hid, sched]) => {
          updatedSCH[hid] = sched;
          _PRISTINE_SCH[hid] = JSON.parse(JSON.stringify(sched));
        });

        Object.assign(SCH, updatedSCH);
        Object.assign(COURSE_NAMES, updatedCN);
        Object.assign(HALL_INFO, updatedHI);

        const fullDataset = {
          CN: updatedCN,
          HI: updatedHI,
          SCH: updatedSCH
        };

        try {
          localStorage.setItem(STORAGE_KEY_CUSTOM_TIMETABLE, JSON.stringify(fullDataset));
          setCommitLog(log => [...log, "✓ Saved changes locally in browser storage."]);
        } catch (e) {
          console.warn("Storage quota warning:", e);
        }

        setTimetableVer(v => v + 1);
        setSwapVersion(v => v + 1);

        const tokenToUse = (ghToken || "").trim();
        if (tokenToUse) {
          if (saveGhToken) {
            try { localStorage.setItem("HALL_FINDER_GH_TOKEN", tokenToUse); } catch(e) {}
          }
          setCommitLog(log => [...log, "▶ Connecting to GitHub API (229003021-spec/hall_finder)..."]);

          try {
            const encryptedPayload = _encryptPayload(fullDataset, _SECURE_KEY);
            setCommitLog(log => [...log, "✓ Encrypted secure payload bundle."]);

            async function updateGhFile(filePath, contentStr, commitMsg) {
              setCommitLog(log => [...log, `• Fetching current ${filePath}...`]);
              const getRes = await fetch(`https://api.github.com/repos/229003021-spec/hall_finder/contents/${filePath}?ref=main`, {
                headers: {
                  "Authorization": `Bearer ${tokenToUse}`,
                  "Accept": "application/vnd.github.v3+json"
                }
              });
              if (!getRes.ok) {
                throw new Error(`Failed to read ${filePath} (${getRes.status} ${getRes.statusText})`);
              }
              const fileInfo = await getRes.json();

              setCommitLog(log => [...log, `• Committing updated ${filePath}...`]);
              const b64Content = btoa(unescape(encodeURIComponent(contentStr)));
              const putRes = await fetch(`https://api.github.com/repos/229003021-spec/hall_finder/contents/${filePath}`, {
                method: "PUT",
                headers: {
                  "Authorization": `Bearer ${tokenToUse}`,
                  "Accept": "application/vnd.github.v3+json",
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  message: commitMsg,
                  content: b64Content,
                  sha: fileInfo.sha,
                  branch: "main"
                })
              });
              if (!putRes.ok) {
                const errData = await putRes.json();
                throw new Error(`Failed to write ${filePath}: ${errData.message || putRes.statusText}`);
              }
              setCommitLog(log => [...log, `✓ Committed ${filePath} successfully.`]);
            }

            const indexRes = await fetch(`https://api.github.com/repos/229003021-spec/hall_finder/contents/index.html?ref=main`, {
              headers: { "Authorization": `Bearer ${tokenToUse}`, "Accept": "application/vnd.github.v3+json" }
            });
            const indexInfo = await indexRes.json();
            const currentHtml = decodeURIComponent(escape(atob(indexInfo.content.replace(/\s/g, ''))));

            const payloadRegex = /const _SECURE_PAYLOAD = "[^"]+";/;
            if (!payloadRegex.test(currentHtml)) {
              throw new Error("Could not find const _SECURE_PAYLOAD in GitHub index.html");
            }
            const updatedHtml = currentHtml.replace(payloadRegex, `const _SECURE_PAYLOAD = "${encryptedPayload}";`);
            const commitMsg = isHallMode
              ? `Update timetable for Hall ${parsedData.targetHall} (Floor ${parsedData.targetFloor}) via Admin Portal`
              : `Update Floor ${parsedData.targetFloor} timetable via Admin Portal (${parsedData.hallList.length} halls)`;

            await updateGhFile("index.html", updatedHtml, commitMsg);
            await updateGhFile("web/index.html", updatedHtml, commitMsg);
            await updateGhFile("timetable_data.json", JSON.stringify(fullDataset, null, 2), commitMsg);

            setCommitLog(log => [...log, "🎉 All changes committed to GitHub! Live site will reflect updates shortly."]);
            setToastMsg({ text: `✓ ${descTarget} timetable updated and pushed to GitHub!`, type: "success" });
          } catch (ghErr) {
            setCommitLog(log => [...log, `⚠️ GitHub Error: ${ghErr.message}`, "Changes remain active locally in this browser."]);
            setToastMsg({ text: `✓ Updated locally! (GitHub error: ${ghErr.message})`, type: "info" });
          }
        } else {
          setCommitLog(log => [
            ...log,
            "✓ Timetable updated and active in your current browser session!",
            "ℹ️ No GitHub token entered. To publish live to all users, enter your GitHub Token or download the updated JSON below."
          ]);
          setToastMsg({ text: `✓ ${descTarget} timetable updated in browser!`, type: "success" });
        }

        setIsCommitting(false);
        setShowConfirmModal(false);
      }

                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <span style={{fontSize:20}}>⚡</span>
                          <span style={{color:"#f8fafc",fontWeight:800,fontSize:14}}>Today's Active Reservations ({activeSwaps.length})</span>
                        </div>
                        <button onClick={()=>setShowSwappedModal(true)} style={{background:"rgba(139,92,246,0.25)",border:"1px solid #8b5cf6",color:"#c4b5fd",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>
                          🔍 View All
                        </button>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:160,overflowY:"auto"}}>
                        {activeSwaps.map(s=>(
                          <div key={s.id} style={{background:"#11092b",border:"1px solid #3b2269",borderRadius:8,padding:"7px 10px",fontSize:11,color:"#e2e8f0",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                            <span>• {s.desc} <span style={{color:"#a78bfa",fontSize:10}}>({s.time||DAY_F[s.day]})</span></span>
                            <button onClick={()=>handleRevertSingle(s.id)} style={{background:"rgba(239,68,68,0.2)",border:"1px solid rgba(239,68,68,0.4)",color:"#fca5a5",borderRadius:6,padding:"2px 8px",cursor:"pointer",fontSize:10,fontWeight:700}} title="Revert this reservation">↺ Revert</button>
                          </div>
                        ))}
                      </div>
                      <div style={{color:"#c4b5fd",fontSize:10,marginTop:8,opacity:0.8}}>
                        ℹ️ Each reservation can be individually reverted. Automatically resets at midnight.
                      </div>
                    </div>
                  )}
                  <div style={{fontSize:52,opacity:.15,filter:"drop-shadow(0 0 10px rgba(139,92,246,0.5))"}}>📋</div>
                  <p style={{color:THEME.mutedText,fontSize:16,fontWeight:600,margin:0}}>Select a hall from the left panel</p>
                  <p style={{color:THEME.mutedText,fontSize:13,margin:0,opacity:0.7}}>The schedule will appear here</p>
                </div>
              ):(
                <div style={{opacity:panelAnim?1:0,transform:panelAnim?"translateX(0)":"translateX(24px)",transition:"opacity 0.28s ease, transform 0.28s ease"}}>
                  <SchedulePanel key={`${selRoom}-${selDay}-${curSid}-${swapVersion}`} hallId={selRoom} day={selDay} curSlotId={curSid}/>
                </div>
              )}
            </div>
          </div>
          {showSwappedModal&&(
            <SwappedClassesModal 
              activeSwaps={activeSwaps}
              onRevertSingle={handleRevertSingle}
              onClose={()=>setShowSwappedModal(false)}
              canRevert={true}
            />
          )}
          {renderToast()}
        </div>
      );

      if(screen==="faculty") return(
        <div className="student-takeover-bg">
          <div style={{position:"fixed",top:-100,left:"50%",transform:"translateX(-50%)",width:700,height:350,background:"radial-gradient(ellipse at center, rgba(99,102,241,0.3) 0%, rgba(0,0,0,0) 70%)",pointerEvents:"none",zIndex:0}}></div>

          <div className="student-banner-anim faculty-header-bar" style={{background:THEME.headerBg,borderBottom:`1px solid ${THEME.headerBorder}`,padding:"14px 20px",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between",position:"relative",zIndex:1,boxShadow:"0 10px 30px rgba(0,0,0,0.5)"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
              <div style={{fontSize:24,flexShrink:0}}>🎓</div>
              <div style={{minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <div className="faculty-title-text" style={{fontSize:18,fontWeight:900,color:"#f1f5f9",letterSpacing:1,whiteSpace:"nowrap"}}>FACULTY PORTAL</div>
                  <span className="faculty-badge-desktop" style={{background:"rgba(99,102,241,0.3)",border:"1px solid rgba(129,140,248,0.4)",color:"#c7d2fe",fontSize:10,fontWeight:800,padding:"2px 8px",borderRadius:20,letterSpacing:"0.06em",textTransform:"uppercase"}}>AVAILABILITY CHECK</span>
                  <span className="faculty-timer-mobile">
                    ⏰ {tStr} · {DAY_F[selDay]}
                  </span>
                </div>
                <div style={{fontSize:11,color:THEME.mutedText,marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>SASTRA DEEMED UNIVERSITY · SRC KUMBAKONAM</div>
              </div>
            </div>

            <div className="faculty-timer-center">
              <div style={{fontFamily:"monospace",fontSize:16,fontWeight:700,color:"#c7d2fe"}}>{tStr}</div>
              <div style={{fontSize:11,color:THEME.highlight,fontWeight:700}}>{DAY_F[selDay]}</div>
            </div>

            <div className="faculty-actions-container">
              <button 
                onClick={()=>setShowSwappedModal(true)}
                className="faculty-btn-swapped"
                style={{
                  background: activeSwaps.length>0?"rgba(139,92,246,0.25)":"rgba(255,255,255,0.06)",
                  border: `1.5px solid ${activeSwaps.length>0?"#8b5cf6":THEME.cardBorder}`,
                  color: activeSwaps.length>0?"#f8fafc":THEME.mutedText,
                  cursor: "pointer",
                  display: "flex",
                  alignItems: "center",
                  fontWeight: 700,
                  boxShadow: activeSwaps.length>0?"0 0 12px rgba(139,92,246,0.3)":"none",
                  transition: "all 0.15s ease"
                }}
                title="View Swapped Classes for Today">
                <span style={{fontSize:13}}>🔄</span>
                <span>Swapped Classes</span>
                {activeSwaps.length>0&&(
                  <span style={{
                    background:"#8b5cf6",
                    color:"#fff",
                    borderRadius:10,
                    padding:"1px 6px",
                    fontSize:10,
                    fontWeight:800
                  }}>
                    {activeSwaps.length}
                  </span>
                )}
              </button>

              <button onClick={logout} 
                className="faculty-btn-logout"
                style={{...bBtn("rgba(255,255,255,0.08)",THEME.mutedText),border:`1px solid ${THEME.cardBorder}`,backdropFilter:"blur(8px)",transition:"all 0.2s ease"}}
                onMouseOver={e=>e.currentTarget.style.background="rgba(255,255,255,0.18)"}
                onMouseOut={e=>e.currentTarget.style.background="rgba(255,255,255,0.08)"}>
                Logout 🔒
              </button>
            </div>
          </div>

          <div className="student-period-anim" style={{position:"relative",zIndex:1}}>
            <DayBar selDay={selDay} setSelDay={setSelDay}/>
          </div>

          <div className="student-content-anim" style={{flex:1,overflowY:"auto",padding:20,maxWidth:820,width:"100%",margin:"0 auto",boxSizing:"border-box",position:"relative",zIndex:1}}>
            <h3 style={{color:THEME.highlight,fontSize:11,textTransform:"uppercase",letterSpacing:"0.09em",margin:"0 0 12px",display:"flex",alignItems:"center",gap:6}}>
              <span>🏛️</span> <span>Hall Availability Overview</span>
            </h3>
            {selDay !== detectDay() && (
              <div style={{background:"rgba(245,158,11,0.12)",border:"1px solid rgba(245,158,11,0.3)",borderRadius:12,padding:"8px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:8,fontSize:11,color:"#fde68a"}}>
                <span>ℹ️</span>
                <span>Viewing <strong>{DAY_F[selDay]}</strong> in read-only mode. Room reservations & swapping are strictly permitted for <strong>Today ({DAY_F[detectDay()]})</strong> only.</span>
              </div>
            )}
            <div className="student-period-anim">
              <PeriodSelector selPid={selPid} setSelPid={setSelPid} isLive={pidLive} setIsLive={setPidLive} curSid={curSid}/>
            </div>
            <div className="student-floor-anim">
              <FloorPicker selFloor={selFloor} setSelFloor={setSelFloor} color={THEME.accent}/>
            </div>
            {!selFloor&&(
              <div style={{textAlign:"center",padding:"42px 20px",color:THEME.mutedText,background:"rgba(15,11,36,0.45)",borderRadius:20,border:`1px solid ${THEME.cardBorder}`,backdropFilter:"blur(12px)",marginTop:14}}>
                <div style={{fontSize:40,marginBottom:10,filter:"drop-shadow(0 0 10px rgba(99,102,241,0.5))"}}>🏢</div>
                <p style={{fontSize:15,fontWeight:700,margin:0,color:THEME.highlight}}>Select a floor above to check vacant & occupied halls</p>
              </div>
            )}
            {activeSwaps.length>0&&(
              <div style={{
                background:"linear-gradient(135deg, rgba(30,17,69,0.95), rgba(67,24,117,0.85))",
                border:"1px solid #8b5cf6",
                borderRadius:14,
                padding:"10px 16px",
                marginBottom:14,
                display:"flex",
                alignItems:"center",
                justifyContent:"space-between",
                flexWrap:"wrap",
                gap:8,
                boxShadow:"0 6px 20px rgba(139,92,246,0.25)"
              }}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:18}}>⚡</span>
                  <div>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{color:"#f8fafc",fontWeight:800,fontSize:13}}>
                        {activeSwaps.length} Temporary Reservation{activeSwaps.length>1?"s":""} Active
                      </span>
                      <span style={{background:"rgba(74,222,128,0.15)",color:"#4ade80",border:"1px solid rgba(74,222,128,0.3)",fontSize:9,padding:"1px 6px",borderRadius:10,fontWeight:700}}>
                        Valid until End of Day
                      </span>
                    </div>
                    <div style={{color:"#c4b5fd",fontSize:11,marginTop:2}}>
                      {activeSwaps[0].desc} {activeSwaps.length>1?`(+${activeSwaps.length-1} more)`:""}
                    </div>
                  </div>
                </div>
                <button onClick={()=>setShowSwappedModal(true)} style={{
                  background:"rgba(139,92,246,0.3)",
                  border:"1px solid #8b5cf6",
                  color:"#e9d5ff",
                  borderRadius:8,
                  padding:"6px 14px",
                  fontSize:11,
                  fontWeight:700,
                  cursor:"pointer",
                  display:"flex",
                  alignItems:"center",
                  gap:5,
                  transition:"all 0.15s ease"
                }}>
                  <span>🔄</span> <span>Manage / Revert Swaps</span>
                </button>
              </div>
            )}
            {selFloor&&<ErrorBoundary><FreeHallsView key={`${selFloor}-${effPid}-${swapVersion}`} day={selDay} effectivePid={effPid} curSid={curSid} floor={selFloor} role="faculty" onApplySwap={handleApplySwap}/></ErrorBoundary>}
          </div>
          {showSwappedModal&&(
            <SwappedClassesModal 
              activeSwaps={activeSwaps}
              onRevertSingle={handleRevertSingle}
              onClose={()=>setShowSwappedModal(false)}
              canRevert={true}
            />
          )}
          {renderToast()}
        </div>
      );

      if(screen==="student"){
        const freeCount=selFloor?floorHalls(selFloor).filter(hid=>isHallFree(hid,selDay,effPid)||typeof effPid!=="number").length:0;
        const curSlotObj=ALL_SLOTS.find(s=>s.id===effPid);
        return(
          <div className="student-takeover-bg">
            <div style={{position:"fixed",top:-100,left:"50%",transform:"translateX(-50%)",width:700,height:350,background:"radial-gradient(ellipse at center, rgba(139,92,246,0.3) 0%, rgba(0,0,0,0) 70%)",pointerEvents:"none",zIndex:0}}></div>
            
            <div className="student-banner-anim student-header-pad" style={{background:THEME.studentBanner,padding:"20px 20px 24px",flexShrink:0,position:"relative",zIndex:1,boxShadow:"0 10px 30px rgba(0,0,0,0.6)",borderBottom:"1px solid rgba(139,92,246,0.35)"}}>
              <div style={{maxWidth:720,margin:"0 auto"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                  <div style={{minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <span style={{fontSize:24}}>🏫</span>
                      <span style={{fontSize:22,fontWeight:900,letterSpacing:-0.5,background:"linear-gradient(135deg, #ffffff 0%, #e9d5ff 100%)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Hall Finder</span>
                      <span style={{background:"rgba(139,92,246,0.35)",border:"1px solid rgba(167,139,250,0.5)",color:"#e9d5ff",fontSize:10,fontWeight:800,padding:"3px 8px",borderRadius:20,letterSpacing:"0.06em",textTransform:"uppercase",boxShadow:"0 0 12px rgba(139,92,246,0.4)"}}>STUDENT PORTAL</span>
                    </div>
                    <div style={{color:"rgba(255,255,255,0.7)",fontSize:11,marginTop:4,fontWeight:600}}>
                      SASTRA DEEMED UNIVERSITY · SRC KUMBAKONAM · {DAY_F[selDay]}
                      {activeSwaps.length>0&&selDay===detectDay()&&(
                        <span className="student-swaps-btn-wrap">
                          <button 
                            onClick={()=>setShowSwappedModal(true)}
                            style={{
                              marginLeft:8,background:"rgba(74,222,128,0.15)",border:"1px solid rgba(74,222,128,0.4)",
                              color:"#4ade80",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:12,cursor:"pointer",
                              display:"inline-flex",alignItems:"center",gap:4
                            }}
                            title="View today's relocated and swapped classes">
                            <span>⚡</span> <span>{activeSwaps.length} Swapped Class{activeSwaps.length>1?"es":""} Reflected</span>
                          </button>
                        </span>
                      )}
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontFamily:"monospace",fontSize:15,fontWeight:700,color:"#e9d5ff"}}>{tStr}</div>
                    <button onClick={()=>{setScreen("landing");setSelFloor(null);}} 
                      style={{...bBtn("rgba(0,0,0,0.4)","rgba(255,255,255,0.9)"),padding:"5px 12px",borderRadius:20,marginTop:5,fontSize:11,border:"1px solid rgba(255,255,255,0.25)",backdropFilter:"blur(8px)",display:"inline-flex",alignItems:"center",gap:4,transition:"all 0.2s ease"}}
                      onMouseOver={e=>e.currentTarget.style.background="rgba(255,255,255,0.2)"}
                      onMouseOut={e=>e.currentTarget.style.background="rgba(0,0,0,0.4)"}>
                      <span>←</span> <span>Home</span>
                    </button>
                  </div>
                </div>

                <div className="student-metrics-bar" style={{background:"rgba(15,11,36,0.65)",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",borderRadius:16,padding:"14px 20px",marginTop:14,display:"flex",gap:24,alignItems:"center",border:"1px solid rgba(139,92,246,0.3)",boxShadow:"0 8px 24px rgba(0,0,0,0.4)"}}>
                  <div>
                    <div style={{color:"rgba(255,255,255,0.55)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em"}}>Free Halls Now</div>
                    <div style={{fontSize:22,fontWeight:900,color:selFloor?"#4ade80":"#e2e8f0"}}>{selFloor?freeCount:"—"}</div>
                  </div>
                  <div className="student-metric-divider" style={{width:1,height:28,background:"rgba(255,255,255,0.15)"}}></div>
                  <div>
                    <div style={{color:"rgba(255,255,255,0.55)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em"}}>Active Period</div>
                    <div style={{fontSize:13,fontWeight:700,color:"#e9d5ff",marginTop:2}}>{curSlotObj?.label||"—"}</div>
                  </div>
                  <div className="student-metric-divider" style={{width:1,height:28,background:"rgba(255,255,255,0.15)"}}></div>
                  <div>
                    <div style={{color:"rgba(255,255,255,0.55)",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em"}}>Time Window</div>
                    <div style={{fontSize:11,fontWeight:600,color:"#c4b5fd",marginTop:3}}>{curSlotObj?.time||"Outside hrs"}</div>
                  </div>
                </div>
              </div>
            </div>

            <div className="student-period-anim" style={{position:"relative",zIndex:1,maxWidth:720,margin:"0 auto",padding:"0 20px 8px",width:"100%",boxSizing:"border-box"}}>
              <DayBar selDay={selDay} setSelDay={setSelDay}/>
            </div>

            <div style={{flex:1,padding:"0 20px 20px",maxWidth:720,width:"100%",margin:"0 auto",boxSizing:"border-box",position:"relative",zIndex:1}}>
              <div className="student-period-anim">
                <PeriodSelector selPid={selPid} setSelPid={setSelPid} isLive={pidLive} setIsLive={setPidLive} curSid={curSid}/>
              </div>
              <div className="student-floor-anim">
                <FloorPicker selFloor={selFloor} setSelFloor={setSelFloor} color={THEME.accent}/>
              </div>
              <div className="student-content-anim">
                {!selFloor&&(
                  <div style={{textAlign:"center",padding:"48px 20px",color:THEME.mutedText,background:"rgba(15,11,36,0.45)",borderRadius:20,border:`1px solid ${THEME.cardBorder}`,backdropFilter:"blur(12px)",marginTop:10}}>
                    <div style={{fontSize:42,marginBottom:12,filter:"drop-shadow(0 0 12px rgba(139,92,246,0.5))"}}>🏢</div>
                    <p style={{fontSize:16,fontWeight:700,margin:0,color:THEME.highlight}}>Select a floor above to view free halls</p>
                    <p style={{fontSize:12,color:THEME.mutedText,marginTop:6}}>Find vacant classrooms & projector halls instantly</p>
                  </div>
                )}
                {selFloor&&<ErrorBoundary><FreeHallsView key={`${selFloor}-${effPid}-${swapVersion}`} day={selDay} effectivePid={effPid} curSid={curSid} floor={selFloor} role="student"/></ErrorBoundary>}
              </div>
            </div>
            {showSwappedModal&&(
              <SwappedClassesModal 
                activeSwaps={activeSwaps}
                onRevertSingle={handleRevertSingle}
                onClose={()=>setShowSwappedModal(false)}
                canRevert={false}
              />
            )}
            {renderToast()}
          </div>
        );
      }

      return null;
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
