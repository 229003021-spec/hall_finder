    function VideoBg() {
      const canvasRef = React.useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const onResize = () => {
          if (!canvas) return;
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', onResize);

        const pts = Array.from({ length: 50 }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 2 + 0.5,
          dx: (Math.random() - 0.5) * 0.5,
          dy: (Math.random() - 0.5) * 0.5,
          a: Math.random() * 0.6 + 0.2
        }));

        const draw = () => {
          ctx.clearRect(0, 0, w, h);
          pts.forEach(p => {
            p.x += p.dx; p.y += p.dy;
            if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(167, 139, 250, ${p.a})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#8b5cf6';
            ctx.fill();
          });
          animId = requestAnimationFrame(draw);
        };
        draw();
        return () => {
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(animId);
        };
      }, []);

      return (
        <div style={{
          position: "fixed", top: 0, left: 0, width: "100vw", height: "100vh",
          overflow: "hidden", zIndex: 0, pointerEvents: "none"
        }}>
          <canvas ref={canvasRef} style={{
            position: "absolute", top: 0, left: 0, width: "100%", height: "100%",
            zIndex: 1, background: "transparent"
          }} />
          <video autoPlay loop muted playsInline style={{
            position: "absolute", top: 0, left: 0, width: "100%", height: "100%",
            objectFit: "cover", zIndex: 0, filter: "brightness(0.35) contrast(1.15) saturate(1.3)"
          }}>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4" type="video/mp4" />
            <source src="https://cdn.coverr.co/videos/coverr-digital-lines-and-dots-5412/1080p.mp4" type="video/mp4" />
          </video>
          <div style={{
            position: "absolute", inset: 0, zIndex: 2,
            background: "radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.18) 0%, rgba(7, 5, 15, 0.85) 75%)",
            backdropFilter: "blur(2px)"
          }}></div>
        </div>
      );
    }

                        <div style={{fontWeight:700,fontSize:14,color:THEME.mutedText}}>Hall {h.id}</div>
                        <span style={{marginLeft:"auto",fontSize:12}}>{h.proj?"📽️":"🪑"}</span>
                      </div>
                      <span style={bBadge("#1c0808","#f87171","#7f1d1d")}>✗ BUSY</span>
                      {courseLabel&&<div style={{color:THEME.mutedText,fontSize:11,marginTop:5,lineHeight:1.3}}>{courseLabel}</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    function App(){
      const [screen,   setScreen]   = useState("landing");
      const [pkInput,  setPkInput]  = useState("");
      const [pkErr,    setPkErr]    = useState(false);
      const [showPK,   setShowPK]   = useState(false);
      const [role,     setRole]     = useState(null);
      const [now,      setNow]      = useState(new Date());
      const [selDay,   setSelDay]   = useState(detectDay);
      const [selFloor, setSelFloor] = useState(null);
      const [selRoom,  setSelRoom]  = useState(null);
      const [curSid,   setCurSid]   = useState(getCurSlotId);
      const [selPid,   setSelPid]   = useState(()=>getCurSlotId()||1);
      const [pidLive,  setPidLive]  = useState(true);
      const [panelAnim,setPanelAnim]= useState(false);

      useEffect(()=>{
        const t=setInterval(()=>{
          const sid=getCurSlotId();setNow(new Date());setCurSid(sid);
          if(pidLive&&sid)setSelPid(sid);
        },1000);
        return()=>clearInterval(t);
      },[pidLive]);

      useEffect(()=>{
        setPanelAnim(false);
        if(selRoom){const t=setTimeout(()=>setPanelAnim(true),40);return()=>clearTimeout(t);}
      },[selRoom]);

      const tStr=now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true});
      const dStr=now.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
      const effPid=pidLive?curSid:selPid;

      function logout(){setScreen("landing");setSelFloor(null);setSelRoom(null);setPkInput("");}
      function goLogin(r){setRole(r);setPkInput("");setPkErr(false);setShowPK(false);setScreen("login");}
      async function tryLogin(){
        const isValid = await verifyPasskey(pkInput, role);
        if(isValid){setScreen(role);setSelFloor(null);setSelRoom(null);setPkErr(false);}
        else setPkErr(true);
      }

      if(screen==="landing") return(
        <div style={{minHeight:"100vh",background:"transparent",position:"relative",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#f8fafc",padding:24,zIndex:1}}>
          <VideoBg />
          <div style={{textAlign:"center",marginBottom:36,zIndex:2}}>
            <div style={{display:"flex",justifyContent:"center",alignItems:"center",marginBottom:14}}>
              <img 
                src="web/sastra_logo_glow.png" 
                alt="SASTRA Logo" 
                style={{
                  height:100,
                  width:"auto",
                  objectFit:"contain",
                  filter:"drop-shadow(0 0 20px rgba(139,92,246,0.5)) drop-shadow(0 0 8px rgba(167,139,250,0.3))",
                  transition:"transform 0.3s ease",
                }}
                onMouseOver={e=>e.currentTarget.style.transform="scale(1.04)"}
                onMouseOut={e=>e.currentTarget.style.transform="scale(1)"}
                onError={e=>{e.currentTarget.src='sastra_logo_glow.png';}}
              />
            </div>
            <h1 style={{margin:0,fontSize:38,fontWeight:900,letterSpacing:-1,background:`linear-gradient(135deg,#fff 0%,${THEME.highlight} 100%)`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Hall Finder</h1>
            <p style={{margin:"10px 0 0",color:THEME.highlightSoft,fontSize:14,fontWeight:800,letterSpacing:"0.06em",lineHeight:1.5,textTransform:"uppercase"}}>
              SASTRA DEEMED UNIVERSITY<br/>
              <span style={{fontSize:12,color:"#c4b5fd",fontWeight:700,letterSpacing:"0.08em"}}>SRC KUMBAKONAM</span>
            </p>
            <p style={{margin:"6px 0 0",color:THEME.mutedText,fontSize:12}}>Odd Semester 2026–27 · Floors 1 – 5</p>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:12,width:"100%",maxWidth:390,zIndex:2,background:"rgba(15,11,36,0.65)",backdropFilter:"blur(16px)",WebkitBackdropFilter:"blur(16px)",padding:24,borderRadius:24,border:"1px solid rgba(139,92,246,0.3)",boxShadow:"0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(139,92,246,0.15)"}}>
            {[
              {r:"dean",   emoji:"👑",label:"Dean",    desc:"Full hall overview & schedules",col:"#8b5cf6"},
              {r:"faculty",emoji:"🎓",label:"Faculty", desc:"Your schedule & free halls",   col:"#6366f1"},
              {r:"student",emoji:"📚",label:"Students",desc:"Find free halls instantly",     col:"#3b82f6"},
            ].map(({r,emoji,label,desc,col})=>(
              <button key={r} onClick={()=>r==="student"?setScreen("student"):goLogin(r)}
                style={{display:"flex",alignItems:"center",gap:14,padding:"16px 20px",borderRadius:16,
                  border:`1px solid ${col}40`,background:`${col}18`,cursor:"pointer",textAlign:"left",transition:"all 0.2s ease"}}
                onMouseOver={e=>{e.currentTarget.style.background=`${col}35`;e.currentTarget.style.transform="translateY(-2px)";}}
                onMouseOut={e=>{e.currentTarget.style.background=`${col}18`;e.currentTarget.style.transform="none";}}>
                <div style={{width:48,height:48,borderRadius:14,background:`${col}30`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>{emoji}</div>
                <div style={{flex:1}}>
                  <div style={{color:"#f1f5f9",fontWeight:700,fontSize:16}}>{label}</div>
                  <div style={{color:THEME.mutedText,fontSize:12,marginTop:2}}>{desc}</div>
                </div>
                <div style={{color:col,fontSize:24,fontWeight:200}}>›</div>
              </button>
            ))}
          </div>
        </div>
      );

      if(screen==="login"){
        const col=role==="dean"?"#8b5cf6":"#6366f1";
        return(
          <div style={{minHeight:"100vh",background:"transparent",position:"relative",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Segoe UI',system-ui,sans-serif",padding:20,zIndex:1}}>
            <VideoBg />
            <div style={{width:"100%",maxWidth:380,background:"rgba(15,11,36,0.75)",backdropFilter:"blur(16px)",WebkitBackdropFilter:"blur(16px)",borderRadius:24,padding:32,border:"1px solid rgba(139,92,246,0.35)",boxShadow:"0 20px 50px rgba(0,0,0,0.6)",zIndex:2}}>
              <button onClick={()=>setScreen("landing")} style={{...bBtn("rgba(255,255,255,0.05)",THEME.mutedText),padding:"5px 12px",marginBottom:20,fontSize:13,border:"1px solid rgba(255,255,255,0.1)"}}>‹ Back</button>
              <div style={{textAlign:"center",marginBottom:28}}>
                <div style={{fontSize:44,marginBottom:8}}>{role==="dean"?"👑":"🎓"}</div>
                <h2 style={{margin:0,color:"#f1f5f9",fontSize:22,fontWeight:800}}>{role==="dean"?"Dean Login":"Faculty Login"}</h2>
                <p style={{margin:"6px 0 0",color:THEME.mutedText,fontSize:13}}>Enter your passkey to continue</p>
              </div>
              <div style={{position:"relative",marginBottom:pkErr?8:16}}>
                <input type={showPK?"text":"password"} value={pkInput}
                  onChange={e=>{setPkInput(e.target.value);setPkErr(false);}}
                  onKeyDown={e=>e.key==="Enter"&&tryLogin()}
                  placeholder="Enter passkey..."
                  style={{width:"100%",padding:"12px 44px 12px 14px",borderRadius:10,
                    border:`1.5px solid ${pkErr?"#ef4444":"rgba(139,92,246,0.4)"}`,
                    background:"rgba(9,6,21,0.8)",color:"#f1f5f9",fontSize:15,outline:"none",
                    boxSizing:"border-box",fontFamily:"inherit"}}/>
                <button onClick={()=>setShowPK(v=>!v)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16}}>
                  {showPK?"🙈":"👁️"}
                </button>
              </div>
              {pkErr&&<p style={{color:"#ef4444",fontSize:13,textAlign:"center",margin:"0 0 14px"}}>❌ Incorrect passkey. Try again.</p>}
              <button onClick={tryLogin} style={{...bBtn(col),width:"100%",padding:13,fontSize:15,borderRadius:10,boxShadow:`0 0 20px ${col}50`}}>Login →</button>
            </div>
          </div>
        );
      }

      if(screen==="dean") return(
        <div style={{height:"100vh",background:THEME.bgBody,display:"flex",flexDirection:"column",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#f8fafc",overflow:"hidden"}}>
          <div style={{background:THEME.headerBg,borderBottom:`1px solid ${THEME.headerBorder}`,padding:"11px 20px",flexShrink:0,display:"flex",alignItems:"flex-start",justifyContent:"space-between"}}>
            <div>
              <div style={{fontSize:20,fontWeight:900,color:THEME.accent,letterSpacing:3,lineHeight:1}}>SRC</div>
              <div style={{fontFamily:"monospace",fontSize:18,fontWeight:700,marginTop:3,color:"#f1f5f9"}}>{tStr}</div>
              <div style={{fontSize:11,color:THEME.mutedText,marginTop:1}}>{dStr}</div>
            </div>
            <div style={{textAlign:"center",paddingTop:2}}>
              <div style={{color:THEME.mutedText,fontSize:11,marginBottom:2}}>Viewing</div>
              <div style={{fontSize:17,fontWeight:800,color:THEME.highlight}}>{DAY_F[selDay]}</div>
            </div>
            <button onClick={logout} style={{...bBtn(THEME.cardBg,THEME.mutedText),padding:"7px 14px",border:`1px solid ${THEME.cardBorder}`}}>Logout</button>
          </div>
          <DayBar selDay={selDay} setSelDay={setSelDay}/>
          <FloorBar selFloor={selFloor} setSelFloor={setSelFloor} onFloorChange={()=>setSelRoom(null)}/>

          <div style={{flex:1,display:"flex",overflow:"hidden"}}>
            <div style={{
              width:selRoom?"20%":180,
              minWidth:selRoom?72:180,
              maxWidth:selRoom?140:180,
              flexShrink:0,borderRight:`1px solid ${THEME.sidebarBorder}`,overflowY:"auto",
              padding:selRoom?"12px 6px":"12px 10px",background:THEME.sidebarBg,
              transition:"width 0.24s ease, min-width 0.24s ease, max-width 0.24s ease, padding 0.24s ease"
            }}>
              {!selFloor&&<p style={{color:THEME.mutedText,fontSize:12,textAlign:"center",marginTop:24,lineHeight:1.5}}>Pick a floor<br/>above</p>}
              {selFloor&&!selRoom&&(
                <React.Fragment>
                  <p style={{color:THEME.mutedText,fontSize:10,textTransform:"uppercase",letterSpacing:"0.1em",margin:"0 0 8px 4px"}}>
                    {ordinal(selFloor)} Floor · {floorHalls(selFloor).length} rooms
                  </p>
                  <div style={{display:"flex",flexDirection:"column",gap:5}}>
                    {floorHalls(selFloor).map(hid=>{
                      const h=HALL_INFO[hid];
                      const isSel=selRoom===hid;
                      const curE=typeof curSid==="number"&&hasTimetable(hid)?getEntry(hid,selDay,curSid):null;
                      const curF=curE&&curE.t==="class"?curE.f:null;
                      const occ=curE&&curE.t==="class";
                      return(
                        <button key={hid} onClick={()=>setSelRoom(isSel?null:hid)}
                          style={{width:"100%",textAlign:"left",padding:"9px 10px",borderRadius:10,
                            border:`1px solid ${isSel?THEME.selectedRoomBorder:THEME.sidebarBorder}`,
                            background:isSel?THEME.selectedRoomBg:"transparent",cursor:"pointer"}}>
                          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
                            <div style={{width:7,height:7,borderRadius:"50%",flexShrink:0,
                              background:hasTimetable(hid)?(occ?"#ef4444":"#22c55e"):THEME.mutedText,
                              boxShadow:hasTimetable(hid)?`0 0 4px ${occ?"#ef4444":"#22c55e"}`:"none"}}></div>
                            <span style={{color:"#e2e8f0",fontWeight:800,fontSize:13}}>Hall {hid}</span>
                            <span style={{marginLeft:"auto",fontSize:10,flexShrink:0}}>{h.proj?"📽️":"🪑"}</span>
                          </div>
                          <div style={{paddingLeft:14,overflow:"hidden"}}>
                            {hasTimetable(hid)
                              ?<div style={{color:curF?isSel?THEME.highlightSoft:"#a78bfa":"#22c55e",fontSize:10,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                                {curF?"👤 "+curF:"✓ Free now"}
                              </div>
                              :<div style={{color:THEME.mutedText,fontSize:10}}>No schedule</div>
                            }
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </React.Fragment>
              )}
              {selFloor&&selRoom&&(
                <React.Fragment>
                  <button onClick={()=>setSelRoom(null)} style={{width:"100%",textAlign:"center",padding:"6px 4px",marginBottom:8,borderRadius:8,border:`1px solid ${THEME.cardBorder}`,background:"transparent",color:THEME.mutedText,cursor:"pointer",fontSize:14}}>←</button>
                  <div style={{display:"flex",flexDirection:"column",gap:5}}>
                    {floorHalls(selFloor).map(hid=>{
                      const h=HALL_INFO[hid];
                      const isSel=selRoom===hid;
                      const curE=typeof curSid==="number"&&hasTimetable(hid)?getEntry(hid,selDay,curSid):null;
                      const occ=curE&&curE.t==="class";
                      return(
                        <button key={hid} onClick={()=>setSelRoom(hid)} title={`Hall ${hid}`}
                          style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,
                            padding:"8px 2px",borderRadius:10,
                            border:`1px solid ${isSel?THEME.selectedRoomBorder:THEME.sidebarBorder}`,
                            background:isSel?THEME.selectedRoomBg:"transparent",cursor:"pointer"}}>
                          <div style={{width:6,height:6,borderRadius:"50%",flexShrink:0,
                            background:hasTimetable(hid)?(occ?"#ef4444":"#22c55e"):THEME.mutedText,
                            boxShadow:hasTimetable(hid)?`0 0 4px ${occ?"#ef4444":"#22c55e"}`:"none"}}></div>
                          <span style={{color:"#e2e8f0",fontWeight:800,fontSize:12}}>{hid}</span>
                          <span style={{fontSize:12}}>{h.proj?"📽️":"🪑"}</span>
                        </button>
                      );
                    })}
                  </div>
                </React.Fragment>
              )}
            </div>

            <div style={{flex:1,overflowY:"auto",padding:selRoom?"20px 16px":"20px 28px",background:THEME.bgBody}}>
              {!selRoom?(
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:10,userSelect:"none"}}>
                  <div style={{fontSize:52,opacity:.15}}>📋</div>
                  <p style={{color:THEME.mutedText,fontSize:16,fontWeight:600,margin:0}}>Select a hall from the left panel</p>
                  <p style={{color:THEME.mutedText,fontSize:13,margin:0,opacity:0.7}}>The schedule will appear here</p>
                </div>
              ):(
                <div style={{opacity:panelAnim?1:0,transform:panelAnim?"translateX(0)":"translateX(24px)",transition:"opacity 0.28s ease, transform 0.28s ease"}}>
                  <SchedulePanel hallId={selRoom} day={selDay} curSlotId={curSid}/>
                </div>
              )}
            </div>
          </div>
        </div>
      );

      if(screen==="faculty") return(
        <div style={{minHeight:"100vh",height:"100vh",background:THEME.bgBody,display:"flex",flexDirection:"column",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#f8fafc",overflow:"hidden"}}>
          <div style={{background:THEME.headerBg,borderBottom:`1px solid ${THEME.headerBorder}`,padding:"11px 20px",flexShrink:0,display:"flex",alignItems:"flex-start",justifyContent:"space-between"}}>
            <div>
              <div style={{fontSize:20,fontWeight:900,color:THEME.accent,letterSpacing:3}}>SRC</div>
              <div style={{fontFamily:"monospace",fontSize:18,fontWeight:700,marginTop:3}}>{tStr}</div>
              <div style={{fontSize:11,color:THEME.mutedText,marginTop:1}}>{dStr}</div>
            </div>
            <button onClick={logout} style={{...bBtn(THEME.cardBg,THEME.mutedText),padding:"7px 14px",border:`1px solid ${THEME.cardBorder}`}}>Logout</button>
          </div>
          <DayBar selDay={selDay} setSelDay={setSelDay}/>
          <div style={{flex:1,overflowY:"auto",padding:18,maxWidth:820,width:"100%",margin:"0 auto",boxSizing:"border-box"}}>
            <h3 style={{color:THEME.highlight,fontSize:11,textTransform:"uppercase",letterSpacing:"0.09em",margin:"0 0 10px"}}>Hall Availability</h3>
            <PeriodSelector selPid={selPid} setSelPid={setSelPid} isLive={pidLive} setIsLive={setPidLive} curSid={curSid}/>
            <FloorPicker selFloor={selFloor} setSelFloor={setSelFloor} color={THEME.accent}/>
            {!selFloor&&<p style={{color:THEME.mutedText,fontSize:13,textAlign:"center",marginTop:16}}>Select a floor above</p>}
            {selFloor&&<FreeHallsView day={selDay} effectivePid={effPid} curSid={curSid} floor={selFloor} role="faculty"/>}
          </div>
        </div>
      );

      if(screen==="student"){
        const freeCount=selFloor?floorHalls(selFloor).filter(hid=>isHallFree(hid,selDay,effPid)||typeof effPid!=="number").length:0;
        const curSlotObj=ALL_SLOTS.find(s=>s.id===effPid);
        return(
          <div style={{minHeight:"100vh",background:THEME.bgBody,display:"flex",flexDirection:"column",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#f8fafc"}}>
            <div style={{background:THEME.studentBanner,padding:"16px 18px 22px",flexShrink:0}}>
              <div style={{maxWidth:680,margin:"0 auto"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontSize:22,fontWeight:900,letterSpacing:-0.5}}>🏫 Hall Finder</div>
                    <div style={{color:"rgba(255,255,255,0.65)",fontSize:12,marginTop:2}}>SASTRA SRC · {DAY_F[selDay]}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontFamily:"monospace",fontSize:16,fontWeight:700}}>{tStr}</div>
                    <button onClick={()=>{setScreen("landing");setSelFloor(null);}} style={{...bBtn("rgba(0,0,0,0.3)","rgba(255,255,255,0.8)"),padding:"5px 11px",borderRadius:7,marginTop:5,fontSize:12}}>← Home</button>
                  </div>
                </div>
                <div style={{background:"rgba(0,0,0,0.25)",borderRadius:12,padding:"10px 16px",marginTop:14,display:"flex",gap:28,flexWrap:"wrap"}}>
                  <div><div style={{color:"rgba(255,255,255,0.55)",fontSize:10}}>Free Now</div><div style={{fontSize:22,fontWeight:900}}>{selFloor?freeCount:"—"}</div></div>
                  <div><div style={{color:"rgba(255,255,255,0.55)",fontSize:10}}>Period</div><div style={{fontSize:14,fontWeight:700,color:"#e9d5ff",marginTop:3}}>{curSlotObj?.label||"—"}</div></div>
                  <div><div style={{color:"rgba(255,255,255,0.55)",fontSize:10}}>Time</div><div style={{fontSize:12,fontWeight:600,color:"#e9d5ff",marginTop:5}}>{curSlotObj?.time||"Outside hrs"}</div></div>
                </div>
              </div>
            </div>
            <div style={{flex:1,overflowY:"auto",padding:16,maxWidth:680,width:"100%",margin:"0 auto",boxSizing:"border-box"}}>
              <PeriodSelector selPid={selPid} setSelPid={setSelPid} isLive={pidLive} setIsLive={setPidLive} curSid={curSid}/>
              <FloorPicker selFloor={selFloor} setSelFloor={setSelFloor} color={THEME.accent}/>
              {!selFloor&&<div style={{textAlign:"center",padding:"36px 0",color:THEME.mutedText}}>
                <div style={{fontSize:36,marginBottom:10}}>🏢</div>
                <p style={{fontSize:14,fontWeight:600,margin:0,color:THEME.highlight}}>Select a floor above</p>
              </div>}
              {selFloor&&<FreeHallsView day={selDay} effectivePid={effPid} curSid={curSid} floor={selFloor} role="student"/>}
            </div>
          </div>
        );
      }

      return null;
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
